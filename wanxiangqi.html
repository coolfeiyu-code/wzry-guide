<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王者万象棋 · 图鉴与攻略 | 王者荣耀攻略总集</title>
<meta name="theme-color" content="#F7F8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)">
<meta name="description" content="王者万象棋全图鉴 + 保姆级攻略 + 官方推荐库主播作业：18 位棋手、85 英雄牌、真实卡面；攻略含词条/阵容/出装，作业页可复制阵容码并查看官方棋盘摆法。">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --paper:#F7F8F4; --paper-2:#EEF1EA; --card:#FFFFFF;
    --ink:#1E2A24; --ink-soft:#5C6B62; --line:#E3E7DF;
    --celadon:#6E8B7B; --celadon-deep:#3C5A4E; --celadon-soft:#A9C2B4;
    --cinnabar:#BE5A45; --gold:#B6904E;
    --shadow:0 1px 2px rgba(30,42,36,.04), 0 8px 24px rgba(30,42,36,.06);
    --shadow-lift:0 2px 6px rgba(30,42,36,.07), 0 14px 34px rgba(30,42,36,.10);
    --font-sans:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --font-kai:"Kaiti SC","STKaiti","KaiTi",serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);line-height:1.7;font-size:15px;
    -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;-webkit-tap-highlight-color:transparent;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 70% at 82% -8%, rgba(110,139,123,.16), transparent 55%),
              radial-gradient(80% 50% at 10% 0%, rgba(182,144,78,.07), transparent 50%);transition:background .3s;}
  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 24px 96px;}

  .appbar{position:sticky;top:0;z-index:40;background:rgba(247,248,244,.82);backdrop-filter:blur(14px) saturate(1.1);
    border-bottom:1px solid var(--line);transition:background .3s,border-color .3s;padding-top:env(safe-area-inset-top);}
  .topbar .inner{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:11px;}
  .brand{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .brand .mark{width:22px;height:22px;border-radius:7px;flex:none;background:linear-gradient(140deg,var(--celadon),var(--celadon-deep));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;}
  .brand .mark span{font-family:var(--font-kai);font-size:14px;font-weight:700;}
  .back-link{font-size:13px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);background:var(--card);
    padding:6px 13px;border-radius:10px;transition:.16s;white-space:nowrap;}
  .back-link:hover{color:var(--celadon-deep);border-color:var(--celadon-soft);}
  .topbar .meta{margin-left:auto;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .theme-toggle{margin-left:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.18s;flex:none;}
  .theme-toggle:hover{border-color:var(--celadon-soft);color:var(--celadon-deep);}
  .theme-toggle svg{width:17px;height:17px;}
  .theme-toggle .i-moon{display:none;}
  [data-theme="dark"] .theme-toggle .i-sun{display:none;}
  [data-theme="dark"] .theme-toggle .i-moon{display:block;}

  .hero{padding:40px 0 22px;position:relative;}
  .hero-card{position:relative;overflow:hidden;border-radius:20px;padding:38px 44px 36px;
    background:radial-gradient(140% 100% at 84% -20%, rgba(110,139,123,.20), transparent 52%),
              radial-gradient(60% 60% at 14% 4%, rgba(182,144,78,.10), transparent 50%),
              linear-gradient(180deg,#EEF2EC 0%, #F6F8F4 62%);
    border:1px solid var(--line);box-shadow:var(--shadow);}
  .hero-card::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .hero .kicker{margin:0 0 12px;font-size:12px;letter-spacing:.32em;color:var(--celadon-deep);font-weight:600;}
  .hero h1{position:relative;margin:0;font-family:var(--font-kai);font-weight:700;font-size:46px;line-height:1.1;letter-spacing:.05em;color:var(--ink);}
  .hero h1 .accent{color:var(--cinnabar);}
  .hero .sub{position:relative;margin:16px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:62ch;line-height:1.75;}
  .hero .chips{position:relative;margin-top:22px;display:flex;flex-wrap:wrap;gap:9px;}
  .hero .chip{font-size:12px;color:var(--celadon-deep);background:rgba(110,139,123,.12);border:1px solid rgba(60,90,78,.20);border-radius:999px;padding:4px 13px;}

  .toolbar{padding:14px 4px 12px;}
  .toolbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
  .seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap;}
  .seg .tab{border:none;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink-soft);padding:7px 15px;border-radius:9px;transition:.18s;cursor:pointer;white-space:nowrap;letter-spacing:.02em;}
  .seg .tab:hover{color:var(--celadon-deep);}
  .seg .tab.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600;}
  .search{font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 13px 8px 34px;min-width:200px;
    font-family:inherit;transition:.18s;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%235C6B62' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");background-repeat:no-repeat;background-position:11px center;}
  .search:focus{outline:none;border-color:var(--celadon-soft);}
  select.filter{font-size:13.5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:inherit;cursor:pointer;transition:.18s;}
  select.filter:focus{outline:none;border-color:var(--celadon-soft);}
  .count{font-size:12.5px;color:var(--ink-soft);margin-left:auto;font-variant-numeric:tabular-nums;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-top:8px;}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.16s;display:flex;flex-direction:column;}
  .ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--celadon-soft);}
  .ccard .img{width:100%;aspect-ratio:1/1;background:var(--paper-2);object-fit:contain;display:block;}
  .ccard .meta{padding:9px 11px;border-top:1px solid var(--line);}
  .ccard .nm{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ccard .bd{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap;}

  .fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden;}
  .fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--celadon-soft);}
  .fcard .fname{font-family:var(--font-kai);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.04em;}
  .fcard .fcount{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .fcard .fdot{font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;}
  .fcard .fbar{height:4px;border-radius:4px;margin-top:14px;background:linear-gradient(90deg,var(--celadon),var(--celadon-deep));opacity:.7;}

  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}

  .modal{position:fixed;inset:0;background:rgba(20,26,23,.52);display:none;z-index:60;backdrop-filter:blur(3px);padding:5vh 12px;}
  .modal.open{display:block;}
  .modal-box{position:relative;width:min(600px,96vw);max-height:90vh;margin:0 auto;background:var(--paper);border-radius:18px;
    box-shadow:var(--shadow-lift);overflow:hidden;display:flex;flex-direction:column;animation:pop .18s ease;}
  .modal-box.wide{width:min(760px,96vw);}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99);}to{opacity:1;transform:none;}}
  .m-head{position:sticky;top:0;display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--paper);z-index:2;}
  .m-head .m-thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--paper-2);border:1px solid var(--line);flex:none;}
  .m-head .m-thumb.contain{object-fit:contain;}
  .m-head .m-tit{font-size:19px;font-weight:700;color:var(--ink);font-family:var(--font-kai);letter-spacing:.03em;}
  .m-head .m-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .modal-close{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;color:var(--ink-soft);font-size:18px;line-height:1;flex:none;transition:.16s;
    display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans);-webkit-tap-highlight-color:transparent;}
  .modal-close:hover{background:var(--paper-2);color:var(--ink);}
  .modal-close .mc-back{display:none;}
  .m-scroll{overflow-y:auto;padding:18px 20px 24px;-webkit-overflow-scrolling:touch;}
  .m-scroll h4{font-size:14px;margin:20px 0 9px;color:var(--celadon-deep);font-family:var(--font-kai);letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
  .m-scroll h4:first-child{margin-top:0;}
  .m-scroll h4 .tag{font-family:var(--font-sans);font-size:11px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;font-weight:500;letter-spacing:0;}
  .skill{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin:11px 0;background:var(--card);}
  .skill .s-name{font-weight:700;color:var(--celadon-deep);font-size:15.5px;font-family:var(--font-kai);}
  .skill .s-kind{font-size:11.5px;color:#fff;background:var(--gold);border-radius:6px;padding:1px 8px;margin-left:8px;}
  .skill .s-desc{margin-top:7px;color:var(--ink-soft);font-size:13.5px;line-height:1.75;}
  .desc-box{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--card);color:var(--ink-soft);font-size:14px;line-height:1.8;}
  /* 官方卡面文案的重点色是为「深色底」设计的（#ffffff 白 / #FFE897 淡金），
     在本页浅色主题下会变成白底白字（表现为"少字/缺字"）。
     这里改为按主题语义上色：词条名词→墨色，条件/关键短语→朱砂。 */
  .hl-term{color:var(--ink);font-weight:600;}
  .hl-gold{color:#B3523F;font-weight:600;}                      /* 浅色主题：略深于 --cinnabar，保证 ≥4.5:1 */
  [data-theme="dark"] .hl-gold{color:var(--cinnabar);}          /* 暗色主题：用主题朱砂即可（4.8:1） */
  .m-badges{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 4px;}
  .m-badges .badge{font-size:12px;padding:3px 10px;}
  .m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px;}
  .m-grid .mini{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;}
  .m-grid .mini:hover{border-color:var(--celadon-soft);transform:translateY(-2px);}
  .m-grid .mini img{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--paper-2);display:block;}
  .m-grid .mini .mn{font-size:11px;color:var(--ink-soft);padding:4px 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .foot{margin-top:52px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.9;}
  .foot b{color:var(--ink);font-weight:600;}
  .foot a{color:var(--celadon-deep);text-decoration:none;}

  /* ===== 攻略板块 ===== */
  .seg .tab.gtab{color:var(--cinnabar);font-weight:600;}
  .seg .tab.gtab.active{color:var(--cinnabar);}
  .guide-root{display:block;}
  .gsec{margin:0 0 32px;}
  .gsec-h{font-family:var(--font-kai);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.04em;display:flex;align-items:center;gap:9px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .gsec-h .gn{font-family:var(--font-sans);font-size:11.5px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;font-weight:600;letter-spacing:.04em;}
  .gsec-h .gh{font-family:var(--font-sans);font-size:12px;color:var(--ink-soft);font-weight:400;letter-spacing:0;margin-left:auto;}
  .gnote{font-size:13px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--celadon);border-radius:10px;padding:12px 14px;margin:0 0 14px;line-height:1.78;}
  .bp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .bp-card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;}
  .bp-card .bp-nm{font-family:var(--font-kai);font-size:19px;font-weight:700;color:var(--ink);}
  .bp-card .bp-tag{font-size:11px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:2px;}
  .bp-card .bp-tag.warn{background:var(--cinnabar);}
  .bp-card .bp-rk{font-size:12.5px;color:var(--gold);margin-top:5px;letter-spacing:.08em;}
  .bp-card .bp-rs{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.76;}
  .glist{margin:0;padding:0;list-style:none;}
  .glist li{position:relative;padding:7px 0 7px 20px;font-size:13.5px;color:var(--ink-soft);line-height:1.72;border-bottom:1px dashed var(--line);}
  .glist li:last-child{border-bottom:none;}
  .glist li::before{content:"·";position:absolute;left:5px;top:4px;color:var(--celadon);font-weight:700;font-size:17px;}
  .tl{position:relative;margin:2px 0 14px;padding-left:18px;border-left:2px solid var(--line);}
  .tl .tl-i{position:relative;padding:0 0 15px 12px;}
  .tl .tl-i:last-child{padding-bottom:2px;}
  .tl .tl-i::before{content:"";position:absolute;left:-26px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--celadon);box-shadow:0 0 0 3px var(--paper);}
  .tl .tl-p{font-size:13.5px;font-weight:700;color:var(--celadon-deep);}
  .tl .tl-t{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.72;}
  .gmotto{font-family:var(--font-kai);font-size:14px;color:var(--cinnabar);text-align:center;margin:14px 0 0;letter-spacing:.06em;}
  .lu{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px;margin:0 0 13px;}
  .lu .lu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lu .lu-tier{font-size:12px;font-weight:700;color:#fff;border-radius:7px;padding:2px 10px;letter-spacing:.03em;}
  .lu .lu-tier.t0{background:var(--cinnabar);} .lu .lu-tier.t05{background:var(--gold);} .lu .lu-tier.t1{background:var(--celadon);}
  .lu .lu-nm{font-family:var(--font-kai);font-size:18px;font-weight:700;color:var(--ink);}
  .lu .lu-row{margin-top:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
  .lu .lu-k{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;flex:none;}
  .chips{display:inline-flex;flex-wrap:wrap;gap:5px;}
  .hchip{font-size:12px;color:var(--celadon-deep);background:rgba(110,139,123,.12);border:1px solid rgba(60,90,78,.20);border-radius:7px;padding:2px 9px;}
  .hchip.p{color:var(--cinnabar);background:rgba(190,90,69,.10);border-color:rgba(190,90,69,.28);}
  .lu .lu-tx{font-size:13px;color:var(--ink-soft);line-height:1.74;margin-top:9px;}
  .lu .lu-eq{font-size:12.5px;color:var(--ink-soft);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.72;}
  .eq-row{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:15px 17px;margin:0 0 11px;}
  .eq-role{font-family:var(--font-kai);font-size:16.5px;font-weight:700;color:var(--celadon-deep);}
  .eq-role .eq-hs{font-family:var(--font-sans);font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:8px;}
  .eq-std{margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.72;}
  .eq-swap{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.7;}
  .eq-note{font-size:12.5px;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.72;}
  .fac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px;}
  .fac-g{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:15px 16px;cursor:pointer;transition:.16s;}
  .fac-g:hover{border-color:var(--celadon-soft);transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .fac-g .fn{font-family:var(--font-kai);font-size:18px;font-weight:700;color:var(--ink);}
  .fac-g .fs{font-size:12px;color:var(--cinnabar);margin-top:4px;font-weight:600;}
  .fac-g .fm{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.7;}
  .fac-g .fc{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;}
  /* 棋手弹窗内的攻略块 */
  .pguide{border:1px solid var(--line);border-radius:13px;padding:6px 16px;background:var(--card);}
  .pguide .pg-row{display:flex;gap:9px;font-size:13.5px;color:var(--ink-soft);padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.72;}
  .pguide .pg-row:last-child{border-bottom:none;}
  .pguide .pg-k{color:var(--celadon-deep);font-weight:600;flex:none;width:5.4em;}
  .pguide .pg-stars{color:var(--gold);letter-spacing:.12em;}
  /* 六大系统详解 */
  .sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:11px;}
  .sys-i{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:13px 15px;}
  .sys-i .sy-n{font-family:var(--font-kai);font-size:15.5px;font-weight:700;color:var(--celadon-deep);}
  .sys-i .sy-t{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.74;}
  /* 词条详解 */
  .kw-wrap{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:15px 17px;margin:0 0 11px;}
  .kw-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .kw-nm{font-family:var(--font-kai);font-size:17.5px;font-weight:700;color:var(--ink);}
  .kw-hit{font-size:11.5px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;}
  .kw-ds{font-size:13px;color:var(--ink-soft);margin-top:7px;line-height:1.74;}
  .kw-ex{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);}
  .kw-ex .kwe{font-size:12.5px;color:var(--ink-soft);line-height:1.76;padding:3px 0 3px 14px;position:relative;}
  .kw-ex .kwe::before{content:"›";position:absolute;left:2px;top:3px;color:var(--celadon);font-weight:700;}
  .kw-ex .kwe b{color:var(--ink);font-weight:600;}
  .kw-tip{font-size:12.5px;color:var(--cinnabar);margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.72;}
  /* 英雄搭配 */
  .cmb{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:15px 17px;margin:0 0 12px;}
  .cmb .cm-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .cmb .cm-nm{font-family:var(--font-kai);font-size:17.5px;font-weight:700;color:var(--ink);}
  .cmb .cm-kw{font-size:11.5px;color:var(--celadon-deep);background:rgba(110,139,123,.14);border:1px solid rgba(60,90,78,.20);border-radius:6px;padding:1px 9px;}
  .cmb .cm-row{margin-top:9px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
  .cmb .cm-k{font-size:12px;color:var(--ink-soft);flex:none;letter-spacing:.06em;}
  .cmb .cm-tx{font-size:13px;color:var(--ink-soft);line-height:1.76;margin-top:9px;}
  .cmb .cm-tx b{color:var(--ink);font-weight:600;}
  .cmb .cm-risk{font-size:12.5px;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.72;}
  /* 阵营详解 */
  .facd{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:15px 17px;margin:0 0 12px;cursor:pointer;transition:.16s;}
  .facd:hover{border-color:var(--celadon-soft);box-shadow:var(--shadow-lift);}
  .facd .fd-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .facd .fd-nm{font-family:var(--font-kai);font-size:18px;font-weight:700;color:var(--ink);}
  .facd .fd-ct{font-size:11.5px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;}
  .facd .fd-df{font-size:11.5px;color:var(--cinnabar);font-weight:600;margin-left:auto;}
  .facd .fd-row{font-size:12.8px;color:var(--ink-soft);line-height:1.76;margin-top:8px;}
  .facd .fd-row b{color:var(--celadon-deep);font-weight:600;}
  [data-theme="dark"] .bp-card,[data-theme="dark"] .lu,[data-theme="dark"] .eq-row,[data-theme="dark"] .fac-g,[data-theme="dark"] .pguide,
  [data-theme="dark"] .sys-i,[data-theme="dark"] .kw-wrap,[data-theme="dark"] .cmb,[data-theme="dark"] .facd{background:var(--card);}

  [data-theme="dark"]{--paper:#141A17;--paper-2:#1E2622;--card:#1F2723;--ink:#E9EEE9;--ink-soft:#9FB0A6;
    --line:#2E3833;--celadon:#84A594;--celadon-deep:#AECBBB;--celadon-soft:#3C5247;--cinnabar:#D9745E;--gold:#CBA867;
    --shadow:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.35);--shadow-lift:0 2px 6px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.45);}
  [data-theme="dark"] body::before{background:radial-gradient(120% 70% at 82% -8%, rgba(132,165,148,.13), transparent 55%),radial-gradient(80% 50% at 10% 0%, rgba(203,168,103,.06), transparent 50%);}
  [data-theme="dark"] .appbar{background:rgba(20,26,23,.82);}
  [data-theme="dark"] .hero-card{background:radial-gradient(140% 100% at 84% -20%, rgba(132,165,148,.16), transparent 52%),radial-gradient(60% 60% at 14% 4%, rgba(203,168,103,.08), transparent 50%),linear-gradient(180deg,#1B221F,#161D19);}
  [data-theme="dark"] .hero-card::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  [data-theme="dark"] .hero .kicker{color:var(--celadon);}
  [data-theme="dark"] .hero .chip{color:var(--celadon);background:rgba(132,165,148,.14);border-color:rgba(174,203,187,.25);}
  [data-theme="dark"] .seg .tab.active{background:var(--card);}
  [data-theme="dark"] .skill{background:var(--card);}
  [data-theme="dark"] .desc-box{background:var(--card);}

  @media (max-width:640px){
    .wrap{padding:0 15px 72px;}
    .topbar .inner{padding:11px 15px;gap:8px;}
    .back-link{padding:8px 11px;font-size:12.5px;}
    .hero{padding:26px 0 16px;}
    .hero-card{padding:28px 22px 26px;border-radius:16px;}
    .hero h1{font-size:34px;}
    .toolbar .row{gap:9px;}
    .search{min-width:0;flex:1 1 140px;padding:8px 12px 8px 32px;background-position:10px center;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;}
    .modal{padding:0;}
    /* iOS Safari 的 100vh 会被地址栏/工具栏盖住 → 用 dvh，底部再让出安全区 */
    .modal-box{width:100%;max-height:100vh;max-height:100dvh;height:100vh;height:100dvh;border-radius:0;margin:0;}
    /* 全屏弹窗里原来的小 × 不显眼、也不像「返回」→ 换成左侧明确的「← 返回」，并避开刘海 */
    .m-head{gap:11px;padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top));}
    .m-head .m-thumb{width:44px;height:44px;border-radius:10px;}
    .m-head .m-tit{font-size:17.5px;}
    .m-head .m-sub{font-size:12px;}
    .modal-close{order:-1;margin-left:0;margin-right:1px;width:auto;min-width:44px;height:44px;padding:0 14px;border-radius:11px;font-size:14px;gap:5px;}
    .modal-close .mc-x{display:none;}
    .modal-close .mc-back{display:inline-flex;align-items:center;gap:5px;}
    .m-scroll{padding:16px 15px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain;}
  }

  /* ==================================================================
     连锁 tab · 词条推演（只演算词条，不模拟打架）
     分层：wanxiangqi-rules.js(规则) → wanxiangqi-engine.js(引擎) → wanxiangqi-chain.js(画)
     这一节只管样式，复用上面同一套月色变量，不引入新视觉系统。
     ================================================================== */
  .chain-root{display:block;}
  .chain-head{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--card);margin:0 0 18px;}
  .chain-title{font-family:var(--font-kai);font-size:23px;font-weight:700;color:var(--ink);letter-spacing:.06em;}
  .chain-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.85;margin-top:7px;}
  .chain-sub b{color:var(--cinnabar);}
  .chain-meta{font-size:12px;color:var(--celadon-deep);margin-top:10px;}
  .chain-meta.bad{color:var(--cinnabar);}

  .chsec{border:1px solid var(--line);border-radius:16px;padding:2px 20px 20px;background:var(--card);margin:0 0 18px;}
  .chsec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--font-kai);
    font-size:16.5px;font-weight:700;color:var(--ink);margin:0;padding:16px 0 14px;border-bottom:1px solid var(--line);letter-spacing:.04em;}
  .chsec-h .gn{font-family:var(--font-sans);font-size:11.5px;font-weight:700;color:var(--celadon-deep);letter-spacing:.12em;margin-right:2px;}
  .chsec-h .gh{font-family:var(--font-sans);font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:0;}
  .tab.ctab{color:var(--celadon-deep);font-weight:600;}
  .tab.ctab.active{color:var(--ink);}

  /* 词条 chip */
  .chkw{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px;}
  .chchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-2);
    color:var(--ink-soft);border-radius:999px;padding:7px 13px;font-size:13px;font-family:inherit;
    cursor:pointer;transition:.16s;min-height:36px;line-height:1;}
  .chchip i{font-style:normal;font-size:11px;opacity:.72;}
  .chchip:hover{border-color:var(--celadon);color:var(--ink);}
  .chchip.on{background:var(--celadon);border-color:var(--celadon);color:#fff;}
  .chchip.on i{opacity:.85;}
  .chchip.ph{font-weight:600;}
  .chchip.d{border-style:dashed;}
  .chrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px 0 3px;border-top:1px dashed var(--line);}
  .chlab{font-size:12px;color:var(--ink-soft);}
  .chjoin{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:6px;}
  .chj{border:none;background:transparent;padding:6px 13px;font-size:12.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer;}
  .chj.on{background:var(--celadon);color:#fff;}
  .chclear{border:none;background:transparent;color:var(--cinnabar);font-size:12.5px;font-family:inherit;
    cursor:pointer;text-decoration:underline;padding:6px 4px;}
  .chcount{font-size:13px;color:var(--ink-soft);margin:14px 0 12px;}
  .chcount b{color:var(--ink);font-size:15px;}
  .chcount .chs{font-size:11.5px;opacity:.75;margin-left:6px;}
  .chain-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));}
  .chain-grid .badge.kw{border-color:var(--celadon-soft);color:var(--celadon-deep);background:transparent;}

  /* 沙盒 */
  .sb-wrap{display:grid;grid-template-columns:minmax(270px,360px) 1fr;gap:18px;margin-top:18px;align-items:start;}
  .sb-board,.sb-tl{border:1px solid var(--line);border-radius:14px;padding:14px 15px 16px;background:var(--paper-2);}
  .sb-tl{min-height:240px;}
  .sb-h{font-size:13px;font-weight:600;color:var(--ink);margin:4px 0 9px;display:flex;gap:8px;
    align-items:baseline;flex-wrap:wrap;line-height:1.5;}
  .sb-h span{font-size:11.5px;font-weight:400;color:var(--ink-soft);}
  .sb-h.dim{opacity:.62;}
  .sb-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .sb-slots.eff{grid-template-columns:repeat(4,1fr);}
  .sb-slots.one{grid-template-columns:1fr;}
  .slot{border:1px dashed var(--line);background:var(--card);border-radius:11px;min-height:76px;padding:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
    font-family:inherit;color:var(--ink-soft);transition:.16s;position:relative;overflow:hidden;}
  .slot:hover{border-color:var(--celadon);}
  .slot.active{border-color:var(--cinnabar);box-shadow:0 0 0 2px rgba(190,90,69,.14);}
  .slot .sl-plus{font-size:19px;line-height:1;}
  .slot .sl-t{font-size:11px;}
  .slot.filled{border-style:solid;border-color:var(--celadon-soft);}
  .slot.filled img{width:100%;height:42px;object-fit:contain;border-radius:7px;background:var(--paper-2);}
  .slot .sl-n{font-size:11.5px;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot .sl-x{position:absolute;top:1px;right:6px;font-size:13px;color:var(--cinnabar);opacity:0;transition:.16s;}
  .slot.filled:hover .sl-x{opacity:1;}
  .slot.ghost{border-style:dotted;opacity:.45;cursor:not-allowed;font-size:11px;line-height:1.5;}
  .slot.ghost i{font-size:10px;font-style:normal;opacity:.85;}

  /* 选牌面板 */
  .pk-panel{border:1px solid var(--celadon);border-radius:12px;padding:12px;margin:0 0 14px;background:var(--card);}
  .pk-h{font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;
    align-items:center;gap:10px;margin-bottom:9px;}
  .pk-close{border:none;background:transparent;color:var(--celadon-deep);font-size:12.5px;font-family:inherit;cursor:pointer;}
  .pk-tools{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
  .pk-q{flex:1 1 120px;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);
    padding:7px 11px;font-size:13px;font-family:inherit;color:var(--ink);}
  .pk-tip{font-size:11px;color:var(--ink-soft);}
  .pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;
    max-height:290px;overflow-y:auto;overscroll-behavior:contain;}
  .pk-item{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:.16s;min-height:44px;}
  .pk-item:hover{border-color:var(--celadon);}
  .pk-item img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:6px;}
  .pk-item span{font-size:11px;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 载入搭配 */
  .sb-presets{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .preset-w{border-bottom:1px dashed var(--line);padding-bottom:7px;}
  .preset-w:last-child{border-bottom:none;padding-bottom:0;}
  .preset{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:8px 10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;
    transition:.16s;min-height:40px;}
  .preset:hover{border-color:var(--celadon);background:var(--paper-2);}
  .ps-n{font-size:12.5px;color:var(--ink);line-height:1.45;}
  .preset-hint{font-size:11px;color:var(--cinnabar);margin-top:5px;line-height:1.6;}
  .sb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .sbtn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;
    padding:8px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;min-height:38px;transition:.16s;}
  .sbtn:hover{border-color:var(--celadon);color:var(--ink);}

  /* 时间轴 */
  .tl-seg{margin-bottom:14px;}
  .tl-seg-h{font-size:12px;color:var(--celadon-deep);font-weight:700;letter-spacing:.1em;
    padding:6px 0 7px;border-bottom:1px solid var(--line);margin-bottom:9px;}
  .tl-row{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border-radius:9px;margin-bottom:5px;
    background:var(--card);border:1px solid transparent;flex-wrap:wrap;font-size:13px;}
  .tl-row.d1{margin-left:18px;}.tl-row.d2{margin-left:36px;}
  .tl-row.d3{margin-left:54px;}.tl-row.d4{margin-left:72px;}
  .tl-row.loop{border-color:var(--cinnabar);background:rgba(190,90,69,.07);}
  .tl-row.rep{opacity:.78;}
  .tl-row.unc{border-style:dashed;}
  .tl-n{font-size:11px;color:var(--ink-soft);min-width:16px;text-align:right;flex:none;padding-top:2px;}
  .tl-when{font-size:11px;color:var(--celadon-deep);border:1px solid var(--celadon-soft);border-radius:6px;
    padding:1px 6px;flex:none;white-space:nowrap;}
  .tl-when.nil{color:var(--ink-soft);border-color:var(--line);}
  .tl-src{font-weight:600;color:var(--ink);cursor:pointer;flex:none;white-space:nowrap;
    border-bottom:1px dotted var(--celadon);}
  .tl-src:hover{color:var(--celadon-deep);}
  .tl-txt{color:var(--ink-soft);line-height:1.72;flex:1 1 170px;min-width:0;}
  .tl-flags{display:inline-flex;gap:4px;flex:none;}
  .tflag{font-size:10.5px;border-radius:5px;padding:1px 6px;border:1px solid;line-height:1.5;}
  .tflag.loop{color:var(--cinnabar);border-color:var(--cinnabar);}
  .tflag.rep{color:var(--ink-soft);border-color:var(--line);}
  .tflag.hyp{color:var(--celadon-deep);border-color:var(--celadon-soft);}
  .tflag.unc{color:var(--gold);border-color:var(--line);border-style:dashed;}
  .tl-note{flex:1 1 100%;font-size:11.5px;color:var(--ink-soft);opacity:.88;line-height:1.62;padding-left:2px;}
  .tl-empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;
    font-size:13.5px;color:var(--ink-soft);line-height:1.85;background:var(--card);}

  /* 结论条（不设胜率条） */
  .tl-end{border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:16px;background:var(--card);}
  .tl-end-h{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:9px;display:flex;
    justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .tl-end-h span{font-size:11.5px;font-weight:400;color:var(--ink-soft);}
  .tl-res{font-size:13.5px;font-weight:600;border-radius:9px;padding:9px 12px;margin-bottom:10px;line-height:1.6;}
  .tl-res.yes{color:var(--cinnabar);background:rgba(190,90,69,.08);border:1px solid rgba(190,90,69,.32);}
  .tl-res.no{color:var(--celadon-deep);background:rgba(110,139,123,.1);border:1px solid var(--celadon-soft);}
  .tl-end-row{display:flex;gap:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.78;padding:6px 0;border-top:1px dashed var(--line);}
  .tl-ek{flex:none;width:5.8em;color:var(--celadon-deep);font-weight:600;}
  .tl-bk,.tl-uc{display:block;margin-bottom:4px;}
  .tl-bk{color:var(--ink);}
  .tl-dim{opacity:.7;}
  .tl-hypwrap{color:var(--ink-soft);}
  .tl-hyptip{display:block;font-size:11.5px;color:var(--cinnabar);margin-top:4px;line-height:1.6;}
  .tl-disclaim{margin-top:10px;font-size:11.5px;color:var(--ink-soft);opacity:.85;
    border-top:1px solid var(--line);padding-top:9px;line-height:1.7;}
  [data-theme="dark"] .tl-res.yes{background:rgba(190,90,69,.16);}
  [data-theme="dark"] .tl-res.no{background:rgba(110,139,123,.16);}

  /* 攻略 → 连锁 的入口按钮 */
  .cm-go{margin-top:10px;}
  .gochain{border:1px solid var(--celadon);background:transparent;color:var(--celadon-deep);border-radius:999px;
    padding:7px 15px;font-size:12.5px;font-family:inherit;cursor:pointer;min-height:36px;transition:.16s;}
  .gochain:hover{background:var(--celadon);color:#fff;}

  @media (max-width:900px){
    .sb-wrap{grid-template-columns:1fr;}
    .sb-tl{min-height:0;}
  }
  @media (max-width:640px){
    .chain-head{padding:15px 16px;}
    .chsec{padding:2px 15px 16px;}
    .chsec-h{font-size:15.5px;padding:14px 0 12px;}
    .chain-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));}
    .slot{min-height:70px;}
    .slot.filled img{height:36px;}
    .pk-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:44vh;}
    .tl-row.d1{margin-left:10px;}.tl-row.d2{margin-left:20px;}
    .tl-row.d3{margin-left:30px;}.tl-row.d4{margin-left:40px;}
    .tl-txt{flex:1 1 100%;}
    .tl-end-row{flex-direction:column;gap:3px;}
    .tl-ek{width:auto;}
    .chain-root{padding-bottom:env(safe-area-inset-bottom);}
    /* 手机端把可点区域抬到拇指够得着的尺寸（词条 chip / 按钮 / 载入搭配） */
    .chchip{min-height:40px;padding:8px 14px;}
    .sbtn{min-height:44px;}
    .preset{min-height:44px;padding:10px 12px;}
    .chj{min-height:34px;}
  }
  /* ===== 作业 tab · 官方阵容页 ===== */
  .tab.jtab{color:var(--gold);font-weight:600;}
  .tab.jtab.active{color:var(--ink);}
  .jobs-root{display:block;}
  .jbar{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;}
  .jbar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .jchip{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);border-radius:999px;
    padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;min-height:36px;line-height:1;}
  .jchip.on{background:var(--card);color:var(--ink);border-color:var(--celadon-soft);font-weight:600;box-shadow:var(--shadow);}
  .jlord{margin-left:auto;}
  .jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .jcard{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 15px 15px;cursor:pointer;transition:.16s;text-align:left;}
  .jcard:hover{border-color:var(--celadon-soft);transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .jcard-avs{display:flex;gap:4px;margin-bottom:10px;min-height:36px;}
  .jcard-nm{font-family:var(--font-kai);font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.02em;}
  .jcard-au{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}
  .jtag{font-size:10.5px;color:#fff;border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px;}
  .jtag.hot{background:var(--cinnabar);} .jtag.god{background:var(--gold);}
  .jpager{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0 4px;}
  .jp-n{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .jbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;
    font-size:13.5px;font-family:inherit;cursor:pointer;min-height:40px;}
  .jbtn.pri{background:var(--celadon-deep);color:#fff;border-color:transparent;white-space:nowrap;}
  .jav{position:relative;display:inline-flex;width:36px;height:36px;flex:none;}
  .jav img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:var(--paper-2);}
  .jav i{display:none;width:100%;height:100%;border-radius:50%;background:linear-gradient(140deg,var(--celadon),var(--celadon-deep));
    color:#fff;font-style:normal;font-family:var(--font-kai);font-weight:700;align-items:center;justify-content:center;font-size:14px;}
  .jav.sm{width:32px;height:32px;}
  .jav.lg{width:56px;height:56px;}
  .jav.eq{width:28px;height:28px;}
  .jav.eq img,.jav.eq i{border-radius:7px;}
  .jback{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:13.5px;
    cursor:pointer;padding:0 0 12px;min-height:40px;}
  .jdoc-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px;}
  .jdoc-tit{flex:1 1 180px;}
  .jdoc-tit h1{margin:0;font-family:var(--font-kai);font-size:28px;font-weight:700;letter-spacing:.04em;color:var(--ink);}
  .jdoc-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .jtri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 12px;}
  .jtwo{display:grid;grid-template-columns:1fr 1.15fr;gap:12px;margin:0 0 12px;}
  .jbox{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px 18px;}
  .jbox h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--celadon-deep);letter-spacing:.04em;}
  .jbox h3 span{font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:8px;letter-spacing:0;}
  .jbox p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.75;}
  .jmuted{font-size:13px;color:var(--ink-soft);}
  .jlord-block{margin-bottom:14px;}
  .jlord-block:last-child{margin-bottom:0;}
  .jlord-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .jlord-n{font-weight:700;font-size:15px;color:var(--ink);}
  .jlord-k{font-size:12px;color:var(--ink-soft);}
  .jsk{padding:8px 0;border-top:1px dashed var(--line);}
  .jsk-k{font-size:11px;color:#fff;background:var(--gold);border-radius:5px;padding:1px 7px;margin-right:6px;}
  .jsk-n{font-weight:600;color:var(--ink);font-size:13.5px;}
  .jsk-d{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:4px;}
  .jboard{display:flex;flex-direction:column;gap:6px;}
  .jrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .jcell{aspect-ratio:1;border-radius:12px;background:var(--paper-2);min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 1px 0;gap:2px;border:none;}
  button.jcell{font-family:inherit;cursor:pointer;}
  .jcell.filled{background:transparent;}
  .jcell img{width:78%;aspect-ratio:1;object-fit:cover;border-radius:50%;display:block;background:var(--paper-2);}
  .jcell .jph{display:none;width:78%;aspect-ratio:1;border-radius:50%;background:linear-gradient(140deg,var(--celadon),var(--celadon-deep));
    color:#fff;font-family:var(--font-kai);font-size:15px;font-weight:700;align-items:center;justify-content:center;font-style:normal;}
  .jcell .jcn{font-size:10px;color:var(--ink-soft);line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .jeq-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .jeq-row:last-child{border-bottom:none;}
  .jeq-hero{font-weight:600;font-size:13.5px;color:var(--ink);min-width:3.5em;}
  .jeq-items{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .jeq-n{font-size:12px;color:var(--ink-soft);}
  .jphase{padding:12px 0;border-bottom:1px dashed var(--line);}
  .jphase:last-child{border-bottom:none;padding-bottom:0;}
  .jph-h{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .jph-h span{font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:8px;}
  .jph-faces{display:flex;flex-wrap:wrap;gap:10px 12px;margin-bottom:8px;}
  .jphero{display:flex;flex-direction:column;align-items:center;gap:4px;width:48px;}
  .jphero em{font-style:normal;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.2;}
  .jphase p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.75;}
  .jtal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .jtal{display:flex;gap:10px;align-items:flex-start;}
  .jtal-n{font-weight:600;font-size:13.5px;color:var(--ink);}
  .jtal-d{font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin-top:2px;}
  [data-theme="dark"] .jcard,[data-theme="dark"] .jbox{background:var(--card);}
  @media (max-width:860px){
    .jtri,.jtwo,.jtal-grid{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .jgrid{grid-template-columns:1fr 1fr;}
    .jcell .jcn{font-size:9px;}
    .jlord{margin-left:0;width:100%;}
    .jbtn{min-height:44px;}
    .jchip{min-height:40px;}
    .jdoc-tit h1{font-size:24px;}
  }

  /* ===== 词条悬停浮层 ===== */
  .wxq-term{cursor:help;border-bottom:1px dotted var(--celadon);color:var(--ink);transition:background .12s;padding:0 1px;border-radius:3px;}
  .wxq-term:hover{background:var(--celadon-soft);}
  #wxqTip{position:fixed;z-index:1200;max-width:300px;width:max-content;display:none;pointer-events:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,30,24,.18);
    padding:12px 13px;color:var(--ink);font-size:13px;line-height:1.7;}
  #wxqTip .tip-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  #wxqTip .tip-img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--paper-2);flex:0 0 auto;}
  #wxqTip .tip-grad{width:54px;height:54px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(140deg,var(--celadon),var(--celadon-deep));color:#fff;font-family:var(--font-kai);font-size:24px;font-weight:700;}
  #wxqTip .tip-name{font-size:15px;font-weight:700;color:var(--ink);}
  #wxqTip .tip-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  #wxqTip .tip-badges{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;}
  #wxqTip .tip-badges .badge{font-size:11px;padding:1px 7px;}
  #wxqTip .desc-box{margin-top:2px;font-size:13px;padding:10px 12px;line-height:1.75;}
  [data-theme="dark"] #wxqTip{box-shadow:0 10px 30px rgba(0,0,0,.5);}
</style>
</head>
<body>
  <div class="appbar"><div class="topbar"><div class="inner">
    <div class="brand"><span class="mark"><span>象</span></span>王者万象棋</div>
    <a class="back-link" href="index.html">← 返回总攻略</a>
    <span class="meta" id="metaLine"></span>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div></div></div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-card">
        <p class="kicker">WÀNXIÀNGQÍ · 万象棋局</p>
        <h1>王者<span class="accent">万象棋</span>图鉴与攻略</h1>
        <p class="sub">官方推荐库阵容（玩法、站位、装备、运营）+ 棋手与卡牌图鉴。点开一套阵容即可抄作业。</p>
        <div class="chips" id="heroChips"></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="row">
        <div class="seg" id="tabs">
          <button class="tab jtab active" data-type="jobs">阵容</button>
          <button class="tab" data-type="players">棋手</button>
          <button class="tab" data-type="hero">英雄</button>
          <button class="tab" data-type="effect">效果</button>
          <button class="tab" data-type="equip">装备</button>
          <button class="tab" data-type="talent">天赋</button>
          <button class="tab gtab" data-type="guide">攻略</button>
          <button class="tab ctab" data-type="chain">连锁</button>
        </div>
        <input class="search" id="q" placeholder="搜索名称…" autocomplete="off">
        <select class="filter" id="fac"><option value="">全部阵营</option></select>
        <select class="filter" id="qual"><option value="">全部阶位</option></select>
        <span class="count" id="count"></span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="foot">
      数据来源：<b>王者万象棋官方</b>（wxq.qq.com 公开数据快照 + 阵容推荐库）· 抓取于 <b id="capDate"></b><br>
      卡面与数值均来自官方公开数据；作业页阵容码可导入游戏。本页为静态图鉴，随官方更新另行同步。
    </div>
  </div>

  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script src="wanxiangqi-data.js"></script>
<script src="wanxiangqi-guide.js"></script>
<script src="wanxiangqi-lineups.js"></script>
<script src="wanxiangqi-jobs.js"></script>
<!-- 连锁：B 规则层 → C 引擎层 → D 界面层，顺序不能换（后者依赖前者） -->
<script src="wanxiangqi-rules.js"></script>
<script src="wanxiangqi-engine.js"></script>
<script src="wanxiangqi-chain.js"></script>
<script>
  (function(){
    var M=window.WXQ_META, FACS=window.WXQ_FACTIONS,
        PLAYERS=window.WXQ_PLAYERS, HEROES=window.WXQ_HEROES,
        EFFECTS=window.WXQ_EFFECTS, EQUIPS=window.WXQ_EQUIPS, TALENTS=window.WXQ_TALENTS,
        GUIDE=window.WXQ_GUIDE;
    var TYPE={hero:HEROES, effect:EFFECTS, equip:EQUIPS, talent:TALENTS};
    var TYPE_LABEL={hero:'英雄', effect:'效果', equip:'装备', talent:'天赋'};
    var QCOLOR={1:'#8a9a8f',2:'#6E8B7B',3:'#5C8AA0',4:'#B6904E',5:'#C77B45',6:'#BE5A45'};

    // theme
    try{var t=localStorage.getItem('wzry-theme');if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}
    document.getElementById('themeToggle').onclick=function(){
      var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',c);try{localStorage.setItem('wzry-theme',c);}catch(e){}
    };

    // header
    document.getElementById('metaLine').textContent='v'+M.version;
    document.getElementById('capDate').textContent=M.capturedAt;
    var heroChips=[
      '棋手 '+M.counts.players, '英雄 '+M.counts.heroes, '效果 '+M.counts.effects,
      '装备 '+M.counts.equips, '天赋 '+M.counts.talents, '流派 '+M.counts.factions
    ];
    if(window.WXQ_JOBS&&WXQ_JOBS.meta&&WXQ_JOBS.meta.counts){
      heroChips.push('阵容 '+WXQ_JOBS.meta.counts.total+' 套');
    }
    document.getElementById('heroChips').innerHTML=heroChips.map(function(s){return '<span class="chip">'+s+'</span>';}).join('');

    // populate faction + quality filters
    var facSel=document.getElementById('fac');
    FACS.forEach(function(f){var o=document.createElement('option');o.value=f.name;o.textContent=f.name;facSel.appendChild(o);});
    var qualSel=document.getElementById('qual');
    for(var q=1;q<=6;q++){var o=document.createElement('option');o.value=q;o.textContent=q+' 阶';qualSel.appendChild(o);}

    var state={type:'jobs', q:'', fac:'', qual:''};

    // 官方文案格式化。
    // 1) 先整体转义，再只还原 <b> / <color>，避免数据里任何意外标签破坏结构；
    // 2) 官方重点色 <color=#ffffff> / <color=#FFE897> 是给深色卡面设计的，
    //    照搬会在浅色主题下"隐形"（表现为缺字）→ 映射为 .hl-term / .hl-gold；
    // 3) 官方 <a href=...> 锚点指向游戏内详情，页面无对应页 → 只去掉标签、保留文字。
    function _lum(hex){
      var h=String(hex||'').replace('#','');
      if(h.length===3)h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
      if(!/^[0-9a-f]{6}$/i.test(h))return -1;
      var f=function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
      return 0.2126*f(0)+0.7152*f(2)+0.0722*f(4);
    }
    function fmt(d){
      var s=(d||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      s=s.replace(/&lt;b&gt;/gi,'<b>').replace(/&lt;\/b&gt;/gi,'</b>');
      s=s.replace(/&lt;color=([^&]*)&gt;/gi,function(m,c){
        var v=String(c||'').trim().toLowerCase(), lum=_lum(v);
        if(lum<0)return '<span class="hl-term">';                                  // 命名色等无法解析 → 当强调处理
        if(lum<=0.55)return '<span style="color:'+v.replace(/[^#0-9a-z(),.%\s-]/g,'')+'">'; // 足够深，保留原色
        return (v==='#ffe897'||v==='#ff9'||v==='#ffe')?'<span class="hl-gold">':'<span class="hl-term">';
      });
      s=s.replace(/&lt;\/color&gt;/gi,'</span>');
      s=s.replace(/&lt;a\s*href=[^&]*&gt;/gi,'').replace(/&lt;a&gt;/gi,'').replace(/&lt;\/a&gt;/gi,'');
      return s.replace(/\n/g,'<br>');
    }
    function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function qBadge(q){var c=QCOLOR[q]||'#8a9a8f';return '<span class="badge" style="color:'+c+';border-color:'+c+'55;background:'+c+'14">'+q+'阶</span>';}

    var grid=document.getElementById('grid');
    function render(){
      var isGuide=state.type==='guide';
      var isJobs=state.type==='jobs';
      var qEl=document.getElementById('q');
      qEl.style.display = (state.type==='faction'||isGuide)?'none':'block';
      qEl.placeholder = isJobs ? '搜索阵容 / 作者 / 英雄 / 棋手…' : '搜索名称…';
      document.getElementById('fac').style.display = (state.type==='players'||state.type==='faction'||isGuide||isJobs)?'none':'inline-block';
      document.getElementById('qual').style.display = (state.type==='players'||state.type==='faction'||isGuide||isJobs)?'none':'inline-block';
      if(isGuide) return renderGuide();
      if(isJobs){
        if(window.WXQ_JOBS_UI) return window.WXQ_JOBS_UI.render(grid,state);
        grid.className='jobs-root';
        grid.innerHTML='<div class="empty">作业模块没加载出来</div>';
        return;
      }
      if(state.type==='chain'){
        if(window.WXQ_CHAIN) return window.WXQ_CHAIN.render(grid,state);
        grid.className='chain-root';
        grid.innerHTML='<div class="empty">连锁模块（wanxiangqi-chain.js）没加载出来</div>';
        return;
      }
      if(state.type==='players') return renderPlayers();
      if(state.type==='faction') return renderFactions();
      return renderCards(state.type);
    }

    function renderPlayers(){
      var arr=PLAYERS.filter(function(p){return !state.q || p.name.indexOf(state.q)>=0;});
      document.getElementById('count').textContent=arr.length+' 位棋手';
      if(!arr.length){grid.innerHTML='<div class="empty">未找到匹配的棋手</div>';return;}
      grid.className='grid';
      grid.innerHTML=arr.map(function(p){
        return '<div class="ccard player" data-p="'+esc(p.name)+'">'
          +'<img class="img" loading="lazy" src="'+p.icon+'" alt="'+esc(p.name)+'" onerror="this.src=\''+p.portrait+'\'">'
          +'<div class="meta"><div class="nm">'+esc(p.name)+'</div>'
          +'<div class="bd">'+(p.skills||[]).map(function(s){return '<span class="badge">'+esc(s.kind)+'</span>';}).join('')+'</div></div></div>';
      }).join('');
    }

    function renderCards(type){
      var arr=TYPE[type].filter(function(c){
        if(state.q && c.name.indexOf(state.q)<0) return false;
        if(state.fac && (c.faction||'无阵营')!==state.fac) return false;
        if(state.qual && String(c.quality)!==state.qual) return false;
        return true;
      });
      document.getElementById('count').textContent=arr.length+' 张'+TYPE_LABEL[type]+'牌';
      if(!arr.length){grid.innerHTML='<div class="empty">未找到匹配的卡牌，换个筛选试试</div>';return;}
      grid.className='grid';
      grid.innerHTML=arr.map(function(c){
        return '<div class="ccard" data-type="'+type+'" data-id="'+c.id+'">'
          +'<img class="img" loading="lazy" src="'+c.img+'" alt="'+esc(c.name)+'">'
          +'<div class="meta"><div class="nm">'+esc(c.name)+'</div>'
          +'<div class="bd">'+qBadge(c.quality)+'<span class="badge">'+esc(c.faction||'无阵营')+'</span></div></div></div>';
      }).join('');
    }

    function renderFactions(){
      document.getElementById('count').textContent=FACS.length+' 大流派';
      grid.className='grid';
      grid.style.gridTemplateColumns='repeat(auto-fill,minmax(200px,1fr))';
      grid.innerHTML=FACS.map(function(f){
        var tot=f.heroes+f.effects+f.equips+f.talents;
        var dots=[];
        if(f.heroes)dots.push(f.heroes+' 英雄');
        if(f.effects)dots.push(f.effects+' 效果');
        if(f.equips)dots.push(f.equips+' 装备');
        if(f.talents)dots.push(f.talents+' 天赋');
        return '<div class="fcard" data-f="'+esc(f.name)+'">'
          +'<div class="fname">'+esc(f.name)+'</div>'
          +'<div class="fcount">'+dots.map(function(d){return '<span class="fdot">'+d+'</span>';}).join('')+'</div>'
          +'<div class="fbar" style="width:'+Math.max(8,Math.min(100,tot/4))+'%"></div></div>';
      }).join('');
      setTimeout(function(){grid.style.gridTemplateColumns='';},0);
    }

    function renderGuide(){
      grid.className='guide-root';grid.style.gridTemplateColumns='';
      if(!GUIDE){grid.innerHTML='<div class="empty">攻略数据未加载</div>';return;}
      document.getElementById('count').textContent='保姆级攻略';
      var h='';
      var chips=function(arr,cls){return (arr||[]).map(function(x){return '<span class="hchip'+(cls||'')+'">'+esc(x)+'</span>';}).join('');};

      // 01 新手开局
      h+='<section class="gsec"><h2 class="gsec-h"><span class="gn">01</span>新手开局 · 棋手三选一<span class="gh">'+esc(GUIDE.beginner.sub)+'</span></h2>';
      h+='<div class="gnote">'+esc(GUIDE.beginner.order)+'</div>';
      h+='<div class="bp-grid">'+GUIDE.beginner.picks.map(function(p){
        var warn=(p.tag==='暂不推荐')?' warn':'';
        return '<div class="bp-card"><div class="bp-nm">'+esc(p.name)+'<span class="bp-tag'+warn+'">'+esc(p.tag)+'</span></div>'
          +'<div class="bp-rk">上手难度 '+esc(p.rank)+'</div><div class="bp-rs">'+esc(p.reason)+'</div></div>';
      }).join('')+'</div></section>';

      // 02 核心机制
      h+='<section class="gsec"><h2 class="gsec-h"><span class="gn">02</span>核心机制 · 通用运营<span class="gh">所有棋手通用</span></h2>';
      h+='<ul class="glist">'+GUIDE.mechanics.core.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(GUIDE.mechanics.systems){
        h+='<div class="gsec-h" style="font-size:15px;border:none;padding:16px 0 8px;">六大系统详解</div>';
        h+='<div class="sys-grid">'+GUIDE.mechanics.systems.map(function(s){
          return '<div class="sys-i"><div class="sy-n">'+esc(s.name)+'</div><div class="sy-t">'+esc(s.text)+'</div></div>';
        }).join('')+'</div>';
      }
      h+='<div class="gsec-h" style="font-size:15px;border:none;padding:18px 0 2px;">运营节奏</div>';
      h+='<div class="tl">'+GUIDE.mechanics.rhythm.map(function(r){return '<div class="tl-i"><div class="tl-p">'+esc(r.phase)+'</div><div class="tl-t">'+esc(r.text)+'</div></div>';}).join('')+'</div>';

    // modal
    var modal=document.getElementById('modal'), modalBox=document.getElementById('modalBox');
    // 弹窗历史栈：每开一层弹窗就压入一条 history 记录。
    // 这样手机端「左滑返回 / 系统返回键 / 浏览器返回」只会关掉弹窗，
    // 而不会再像以前那样直接把用户带出整个页面（回到上一页）。
    var mstack=[];
    function paintModal(){
      var top=mstack[mstack.length-1];
      if(top){
        modalBox.innerHTML=top.html;
        modalBox.classList.toggle('wide', !!top.wide);
        modal.classList.add('open');document.body.style.overflow='hidden';
      }else{
        modalBox.innerHTML='';
        modalBox.classList.remove('wide');
        modal.classList.remove('open');document.body.style.overflow='';
      }
    }
    function openModal(html,hash,opt){
      mstack.push({html:html,hash:hash||'',wide:!!(opt&&opt.wide)});
      paintModal();
      try{history.pushState({wxq:mstack.length},'',hash||location.pathname+location.search);}catch(e){}
    }
    // 回退后地址栏可能残留 #p-/ #c-/ #f-/ #j-，清掉它，免得刷新时又弹出弹窗
    function cleanModalHash(){
      if(/^#(p|c|f|j)-/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
    }
    // 点 × / 返回 / Esc / 点遮罩：统一交给系统回退处理，保证和手势返回行为一致
    function closeModal(){
      if(mstack.length){try{history.back();return;}catch(e){}}
      mstack.length=0;paintModal();
    }
    window.addEventListener('popstate',function(){
      if(mstack.length>0){
        mstack.pop();paintModal();
        if(!mstack.length)cleanModalHash();
      }else{
        route();
      }
    });
    // 弹窗内点击：点遮罩关闭；点阵营成员卡进入该卡详情（此前只有 #grid 上绑了 .mini，
    // 而 .mini 只出现在弹窗里，导致「阵营成员」看着可点其实没反应）
    modal.addEventListener('click',function(e){
      if(e.target===modal)return closeModal();
      if(window.WXQ_JOBS_UI&&WXQ_JOBS_UI.onModalClick(e))return;
      var mn=e.target.closest('.mini');if(mn)return openCard(mn.dataset.type,+mn.dataset.id);

      try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}

    window.__wxq={close:closeModal, openPlayer:openPlayer, openCard:openCard, openFaction:openFaction};
    // 连锁 tab（wanxiangqi-chain.js）用的桥：它只负责画，通用工具从这儿拿，
    // 避免两个文件各写一套 esc / fmt 导致高亮不一致。
    window.__wxqUI={
      esc:esc, fmt:fmt, qBadge:qBadge, openCard:openCard, openPlayer:openPlayer, openModal:openModal, closeSilent:closeSilent,
      state:state, TYPE:TYPE, TYPE_LABEL:TYPE_LABEL,
      PLAYERS:PLAYERS, HEROES:HEROES, EFFECTS:EFFECTS
    };

    // ===== 词条悬停浮层：把攻略正文中的英雄/装备/效果/天赋/棋手/流派名自动包成可悬停项 =====
    var REG={};
    function regAdd(name,kind,img,desc,quality,faction,sub){
      if(!name||REG[name])return;
      REG[name]={kind:kind,name:name,img:img,desc:desc,quality:quality,faction:faction,sub:sub};
    }
    function buildRegistry(){
      REG={};
      (HEROES||[]).forEach(function(c){ if(c.name&&c.name.length>=2) regAdd(c.name,'hero',c.img,c.desc,c.quality,c.faction,''); });
      (EFFECTS||[]).forEach(function(c){ if(c.name&&c.name.length>=2) regAdd(c.name,'effect',c.img,c.desc,c.quality,c.faction,''); });
      (EQUIPS||[]).forEach(function(c){ if(c.name&&c.name.length>=2) regAdd(c.name,'equip',c.img,c.desc,c.quality,c.faction,''); });
      (TALENTS||[]).forEach(function(c){ if(c.name&&c.name.length>=2) regAdd(c.name,'talent',c.img,c.desc,c.quality,c.faction,''); });
      (PLAYERS||[]).forEach(function(p){
        var g=(GUIDE&&GUIDE.players)?GUIDE.players[p.name]:null;
        var d=(g&&g.skill)?g.skill:(p.skills&&p.skills[0]?p.skills[0].desc:'');
        var sub=(g&&g.stars)?('上手难度 '+g.stars):'';
        regAdd(p.name,'player',p.icon,d,'','',sub);
      });
      (FACS||[]).forEach(function(f){
        var gf=(GUIDE&&GUIDE.factions)?GUIDE.factions.find(function(x){return x.name===f.name;}):null;
        var d=gf?(gf.mech+(gf.idea?'；'+gf.idea:'')):(f.note||'');
        var sub=f.heroes?(f.heroes+' 英雄 · '+(f.effects||0)+' 效果 · '+(f.equips||0)+' 装备 · '+(f.talents||0)+' 天赋'):'';
        regAdd(f.name,'faction',null,d,'','',sub);
      });
      if(GUIDE&&GUIDE.keywords&&GUIDE.keywords.list){
        GUIDE.keywords.list.forEach(function(kw){
          if(!kw||!kw.key)return;
          var d=kw.desc||'';
          if(kw.ex&&kw.ex.length){ d+='　示例：'+kw.ex.slice(0,3).map(function(e){return e.hero+'·'+e.text;}).join('；'); }
          regAdd(kw.key,'keyword',null,d,'','',(kw.hits?('出现 '+kw.hits+' 次'):'词条'));
        });
      }
    }
    var TERM_RE=null;
    function buildTermRe(){
      var names=Object.keys(REG).sort(function(a,b){return b.length-a.length;});
      var body=names.map(function(n){return n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
      return body?new RegExp('('+body+')','g'):null;
    }
    function linkifyTerms(root){
      if(!TERM_RE)TERM_RE=buildTermRe();
      if(!TERM_RE||!root)return;
      var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
      var tns=[]; var tn;
      while(tn=walker.nextNode()){
        if(!tn.nodeValue||!tn.nodeValue.trim())continue;
        if(tn.parentNode&&tn.parentNode.nodeType===1&&tn.parentNode.closest&&tn.parentNode.closest('.wxq-term'))continue;
        if(tn.parentNode&&tn.parentNode.closest&&tn.parentNode.closest('#wxqTip'))continue;
        tns.push(tn);
      }
      tns.forEach(function(t){
        var txt=t.nodeValue;
        TERM_RE.lastIndex=0;
        if(!TERM_RE.test(txt))return;
        TERM_RE.lastIndex=0;
        var html=txt.replace(TERM_RE,function(m){return '<span class="wxq-term" data-k="'+esc(m)+'">'+esc(m)+'</span>';});
        if(html===txt)return;
        var sp=document.createElement('span'); sp.innerHTML=html;
        if(t.parentNode)t.parentNode.replaceChild(sp,t);
      });
    }
    var tip=document.createElement('div'); tip.id='wxqTip'; document.body.appendChild(tip);
    function tipHTML(en){
      var img = en.img ? '<img class="tip-img" src="'+en.img+'" alt="'+esc(en.name)+'" onerror="this.style.display=\'none\'">' : '<div class="tip-grad">'+esc(en.name.slice(0,1))+'</div>';
      var badge='';
      if(en.quality)badge+=qBadge(en.quality);
      if(en.faction)badge+='<span class="badge">'+esc(en.faction)+'</span>';
      var sub=en.sub?'<div class="tip-sub">'+esc(en.sub)+'</div>':'';
      return '<div class="tip-head">'+img+'<div class="tip-meta"><div class="tip-name">'+esc(en.name)+'</div>'+sub+(badge?'<div class="tip-badges">'+badge+'</div>':'')+'</div></div>'+(en.desc?'<div class="desc-box">'+fmt(en.desc)+'</div>':'');
    }
    function showTip(el){
      var name=el.getAttribute('data-k'); var en=REG[name]; if(!en)return;
      tip.innerHTML=tipHTML(en);
      tip.style.display='block';
      var r=el.getBoundingClientRect();
      var tw=tip.offsetWidth, th=tip.offsetHeight;
      var vw=window.innerWidth, vh=window.innerHeight;
      var left=r.left+r.width/2-tw/2;
      left=Math.max(8,Math.min(left,vw-tw-8));
      var top=r.top-th-8;
      if(top<8)top=r.bottom+8;
      tip.style.left=Math.round(left)+'px';
      tip.style.top=Math.round(top)+'px';
    }
    function hideTip(){tip.style.display='none';}
    // 只在真正支持悬停的设备上绑 hover：触屏端浏览器会补发 mouseover/mouseout，
    // 会让「点一下」弹出的浮层立刻被 mouseout 收走，所以触屏端只走 click。
    var CANHOVER=window.matchMedia?window.matchMedia('(hover: hover)').matches:true;
    if(CANHOVER){
      grid.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('.wxq-term');if(t)showTip(t);});
      grid.addEventListener('mouseout',function(e){var t=e.target.closest&&e.target.closest('.wxq-term');if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))hideTip();});
    }
    buildRegistry();

      if(window.WXQ_JOBS_UI)window.WXQ_JOBS_UI.state.openKey='';

    });
    document.getElementById('q').addEventListener('input',function(){state.q=this.value.trim();render();});
    document.getElementById('fac').addEventListener('change',function(){state.fac=this.value;render();});
    document.getElementById('qual').addEventListener('change',function(){state.qual=this.value;render();});
    grid.addEventListener('click',function(e){
      hideTip();
      var wt=e.target.closest('.wxq-term'); if(wt){ showTip(wt); return; }
      var gc=e.target.closest('.gochain[data-preset]');
      if(gc){if(window.WXQ_CHAIN)window.WXQ_CHAIN.openPreset(+gc.getAttribute('data-preset'));return;}
      if(window.WXQ_JOBS_UI){
        var jr=WXQ_JOBS_UI.onGridClick(e);
        if(jr==='rerender'){render();return;}
        if(jr)return;
      }
      var f=e.target.closest('.ccard');if(f){if(f.dataset.p)return openPlayer(f.dataset.p);if(f.dataset.type)return openCard(f.dataset.type,+f.dataset.id);}
      var fc=e.target.closest('.fcard');if(fc)return openFaction(fc.dataset.f);
      var gf=e.target.closest('.facd');if(gf&&gf.dataset.guideFac)return openFaction(gf.dataset.guideFac);
      var mn=e.target.closest('.mini');if(mn)return openCard(mn.dataset.type,+mn.dataset.id);
    });
    grid.addEventListener('change',function(e){
      if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-job-lord')&&window.WXQ_JOBS_UI){
        WXQ_JOBS_UI.onLordChange(e.target);render();
      }
    });

    function route(h){
      if(h===undefined)h=location.hash;
      if(!h||h==='#'){
        if(window.WXQ_JOBS_UI&&WXQ_JOBS_UI.state.openKey)window.WXQ_JOBS_UI.closeDetail(true);
        return;
      }
      if(h==='#g'||h==='#guide'){var gt=document.querySelector('.tab[data-type="guide"]');if(gt)gt.click();return;}
      if(h==='#j'||h==='#jobs'){
        var jt=document.querySelector('.tab[data-type="jobs"]');if(jt)jt.click();
        if(window.WXQ_JOBS_UI)window.WXQ_JOBS_UI.closeDetail(true);
        return;
      }
      if(h.indexOf('#j-')===0){
        var jt2=document.querySelector('.tab[data-type="jobs"]');if(jt2)jt2.click();
        var jk=decodeURIComponent(h.slice(3));
        if(window.WXQ_JOBS_UI)window.WXQ_JOBS_UI.open(jk,true);
        return;
      }
      if(h.indexOf('#p-')===0)return openPlayer(decodeURIComponent(h.slice(3)));
      if(h.indexOf('#c-')===0){var s=h.slice(3).split('-');var id=+s.pop();return openCard(s.join('-'),id);}
      if(h.indexOf('#f-')===0)return openFaction(decodeURIComponent(h.slice(3)));
    }

    render();
    var _initHash=location.hash;
    // 深链进入弹窗时，先把基础 URL 上的 hash 抹掉，之后弹窗再压入属于自己的历史记录。
    // 于是「返回 / 左滑」只关弹窗，不会把用户带出本站。
    if(/^#(p|c|f)-/.test(_initHash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
    route(_initHash);
  })();
  </script>
</body>
</html>
