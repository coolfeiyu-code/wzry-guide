<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>王者荣耀 S44 英雄攻略总集 · 全英雄</title>
<meta name="description" content="王者荣耀 S44 赛季全英雄攻略总集：按分路归类，含版本调整、梯度、出装铭文与克制关系，数据驱动、可实时更新。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S44 攻略总集">
<meta name="theme-color" content="#F7F8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)">
<script>
(function(){try{var t=localStorage.getItem('wzry-theme');if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233C5A4E'/%3E%3Cpath d='M16 7 C13 12 13 17 16 22 C19 17 19 12 16 7 Z M16 22 C11 19 8 16.5 9 12.5 C13 14.5 14.8 17.5 16 22 Z M16 22 C21 19 24 16.5 23 12.5 C19 14.5 17.2 17.5 16 22 Z' fill='%23F7F8F4'/%3E%3C/svg%3E">
<style>
  :root{
    /* 荷塘月色 · 水墨留白：月光宣纸底 + 墨绿黑字 + 莲青点缀 */
    --paper:#F7F8F4;          /* 月光宣纸（冷调米白） */
    --paper-2:#EEF1EA;        /* 浅panel */
    --card:#FFFFFF;           /* 卡片表面 */
    --ink:#1E2A24;            /* 墨绿黑（主文字） */
    --ink-soft:#5C6B62;       /* 次级墨色 */
    --line:#E3E7DF;          /* 发丝线 */
    --celadon:#6E8B7B;        /* 莲青（主点缀） */
    --celadon-deep:#3C5A4E;   /* 深墨绿（强调） */
    --celadon-soft:#A9C2B4;   /* 莲青淡染 */
    --cinnabar:#BE5A45;       /* 朱砂（仅关键信息） */
    --gold:#B6904E;           /* 克制金（细线/高光） */
    --shadow:0 1px 2px rgba(30,42,36,.04), 0 8px 24px rgba(30,42,36,.06);
    --shadow-lift:0 2px 6px rgba(30,42,36,.07), 0 14px 34px rgba(30,42,36,.10);
    --font-sans:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --font-serif:"Songti SC","STSong","SimSun",serif;
    --font-kai:"Kaiti SC","STKaiti","KaiTi",var(--font-serif);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--font-sans);line-height:1.7;font-size:15px;
    -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;}

  /* 极淡荷塘纹理：仅顶部月光晕染，绝不喧宾夺主 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 70% at 82% -8%, rgba(110,139,123,.16), transparent 55%),
      radial-gradient(80% 50% at 10% 0%, rgba(182,144,78,.07), transparent 50%);
    transition:background .3s;}

  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 24px 96px;}

  /* 应用栏：顶栏 + 工具栏合并为一条连贯的 sticky 栏（消除双阴影接缝） */
  .appbar{position:sticky;top:0;z-index:40;background:rgba(247,248,244,.82);
    backdrop-filter:blur(14px) saturate(1.1);border-bottom:1px solid var(--line);transition:background .3s,border-color .3s;
    padding-top:env(safe-area-inset-top);}
  .topbar{background:transparent;}
  .topbar .inner{max-width:1120px;margin:0 auto;padding:13px 24px;
    display:flex;align-items:center;gap:11px;}
  .brand{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .brand .mark{width:22px;height:22px;border-radius:7px;flex:none;
    background:linear-gradient(140deg,var(--celadon),var(--celadon-deep));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .brand .mark svg{display:block;width:100%;height:100%;}
  .topbar .meta{margin-left:auto;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.01em;}

  /* 主题切换（月色 / 晴昼） */
  .theme-toggle{margin-left:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
    transition:.18s;flex:none;}
  .theme-toggle:hover{border-color:var(--celadon-soft);color:var(--celadon-deep);}
  .theme-toggle svg{width:17px;height:17px;}
  .theme-toggle .i-moon{display:none;}
  [data-theme="dark"] .theme-toggle .i-sun{display:none;}
  [data-theme="dark"] .theme-toggle .i-moon{display:block;}

  /* Hero：荷塘月色 · 留白与书法 */
  .hero{padding:48px 0 28px;position:relative;}
  .hero-card{position:relative;overflow:hidden;border-radius:20px;padding:46px 48px 44px;
    background:
      radial-gradient(140% 100% at 84% -20%, rgba(110,139,123,.20), transparent 52%),
      radial-gradient(60% 60% at 14% 4%, rgba(182,144,78,.10), transparent 50%),
      linear-gradient(180deg, #EEF2EC 0%, #F6F8F4 62%);
    border:1px solid var(--line);
    box-shadow:var(--shadow);}
  .hero-card::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .hero-art{position:absolute;right:30px;bottom:22px;width:172px;height:auto;color:var(--celadon);opacity:.24;pointer-events:none;transition:color .3s,opacity .3s;}
  .hero .kicker{margin:0 0 14px;font-size:12px;letter-spacing:.32em;color:var(--celadon-deep);font-weight:600;}
  .hero h1{position:relative;margin:0;font-family:var(--font-kai);font-weight:700;
    font-size:54px;line-height:1.08;letter-spacing:.05em;color:var(--ink);transition:color .3s;}
  .hero h1 .accent{color:var(--cinnabar);font-weight:700;}
  .hero .sub{position:relative;margin:18px 0 0;font-size:15px;color:var(--ink-soft);max-width:60ch;line-height:1.75;}
  .hero .chips{position:relative;margin-top:24px;display:flex;flex-wrap:wrap;gap:9px;}
  .hero .chip{font-size:12px;color:var(--celadon-deep);background:rgba(110,139,123,.12);
    border:1px solid rgba(60,90,78,.20);border-radius:999px;padding:4px 13px;letter-spacing:.02em;}

  /* 工具栏：精致胶囊组（现处于应用栏内，不再独立 sticky） */
  .toolbar{position:static;background:transparent;border:none;border-radius:0;box-shadow:none;padding:10px 4px 14px;margin:0;}
  .toolbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
  .seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px;}
  .seg .tab{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13.5px;
    color:var(--ink-soft);padding:6px 15px;border-radius:9px;transition:color .18s, background .18s;white-space:nowrap;letter-spacing:.02em;}
  .seg .tab:hover{color:var(--celadon-deep);}
  .seg .tab.active{background:var(--card);color:var(--celadon-deep);font-weight:600;box-shadow:0 1px 3px rgba(30,42,36,.08);}
  .tiers{display:inline-flex;flex-wrap:wrap;gap:6px;}
  .tier-btn{font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);
    border-radius:9px;padding:5px 12px;color:var(--ink-soft);font-family:inherit;transition:.18s;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .tier-btn:hover{border-color:var(--celadon-soft);color:var(--celadon-deep);}
  .tier-btn.active{background:var(--celadon-deep);color:#fff;border-color:var(--celadon-deep);}
  .toggle-pill{font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);
    border-radius:9px;padding:5px 13px;color:var(--ink-soft);font-family:inherit;transition:.18s;white-space:nowrap;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;}
  .toggle-pill:hover{border-color:var(--celadon-soft);color:var(--celadon-deep);}
  .toggle-pill.active{background:var(--celadon-deep);color:#fff;border-color:var(--celadon-deep);}
  .toggle-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;transition:.18s;}
  .toggle-pill.active .dot{opacity:1;}
  .search-wrap{position:relative;flex:1;min-width:190px;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);pointer-events:none;}
  .search{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:11px;
    font-size:14px;background:var(--card);color:var(--ink);font-family:inherit;transition:.18s;}
  .search::placeholder{color:#9aa39c;}
  .search:focus{outline:none;border-color:var(--celadon);box-shadow:0 0 0 3px rgba(110,139,123,.14);}
  .count{font-size:12.5px;color:var(--ink-soft);margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.02em;}

  /* 分组列表 */
  main{padding-top:8px;}
  .role-head{display:flex;align-items:baseline;gap:12px;margin:40px 0 16px;
    padding-bottom:10px;border-bottom:1px solid var(--line);}
  .role-head .name{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.06em;font-family:var(--font-kai);}
  .role-head .desc{font-size:12.5px;color:var(--ink-soft);}
  .role-head .rcount{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;}

  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;
    cursor:pointer;transition:transform .2s cubic-bezier(.16,1,.3,1),border-color .2s,box-shadow .2s;
    opacity:0;transform:translateY(10px);animation:rise .46s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:calc(var(--i,0)*34ms);}
  @keyframes rise{to{opacity:1;transform:none;}}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
    background:var(--celadon-soft);opacity:0;transition:opacity .2s;}
  .card:hover{transform:translateY(-3px);border-color:var(--celadon-soft);box-shadow:var(--shadow-lift);}
  .card:hover::before{opacity:1;}
  .card:active{transform:translateY(-1px) scale(.992);}
  .card:focus-visible{outline:none;border-color:var(--celadon);box-shadow:0 0 0 3px rgba(110,139,123,.18);}
  .card.has-detail::before{opacity:1;background:var(--celadon);}
  .card-top{display:flex;align-items:center;gap:11px;}
  .card-top .lead{display:flex;align-items:center;gap:11px;min-width:0;}
  .card .nm{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ava{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:var(--paper-2);border:1px solid var(--line);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
  .ava-fallback{display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:18px;color:var(--celadon-deep);}
  .card .core{margin:10px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .tag{font-size:11px;background:rgba(110,139,123,.12);color:var(--celadon-deep);border-radius:999px;padding:2px 10px;white-space:nowrap;letter-spacing:.02em;}

  /* 紧凑视图：更多列、收起核心句与多余留白，适合快速扫 137 名英雄 */
  .grid.compact{grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:11px;}
  .compact .card{padding:11px 13px;animation-delay:calc(var(--i,0)*18ms);}
  .compact .card .core{display:none;}
  .compact .card .tags{margin-top:9px;gap:5px;}
  .compact .card .ava{width:32px;height:32px;border-radius:9px;}
  .compact .card-top{gap:9px;}
  .compact .card .nm{font-size:14.5px;}
  .compact .card::before{top:10px;bottom:10px;}

  /* 梯度徽标（fg 已加深至 WCAG AA ≥4.5:1） */
  .tier{font-size:11px;font-weight:600;color:#fff;border-radius:7px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto;letter-spacing:.03em;}
  .t-T0{background:#F6E7E2;color:#A33C2C;} .t-T05{background:#F6EEDB;color:#866023;}
  .t-T1{background:#E7F0EA;color:#3C5A4E;} .t-T15{background:#ECF2EE;color:#4F7264;}
  .t-T2{background:#EFEFEA;color:#5C6158;} .t-dash{background:#F0EFE9;color:#6E6A61;}

  .empty{text-align:center;color:var(--ink-soft);padding:52px 20px;font-size:14px;
    border:1px dashed var(--line);border-radius:14px;margin-top:20px;}
  .empty button{margin-top:14px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--celadon-deep);
    background:var(--card);border:1px solid var(--celadon-soft);border-radius:9px;padding:7px 16px;transition:.18s;}
  .empty button:hover{border-color:var(--celadon);background:var(--paper-2);}

  .foot{margin-top:52px;font-size:12px;color:var(--ink-soft);text-align:center;
    border-top:1px solid var(--line);padding-top:20px;line-height:1.95;}
  .foot b{color:var(--ink);font-weight:600;}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(20,28,24,.52);display:none;z-index:60;
    align-items:flex-start;justify-content:center;padding:52px 16px;overflow:auto;backdrop-filter:blur(3px);}
  .modal.open{display:flex;}
  .modal-box{background:var(--paper);max-width:820px;width:100%;border-radius:18px;padding:30px 32px;
    box-shadow:0 28px 80px rgba(0,0,0,.34);position:relative;border:1px solid var(--line);
    animation:pop .26s cubic-bezier(.16,1,.3,1);}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
  .modal-close{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:9px;
    font-size:20px;cursor:pointer;color:var(--ink-soft);border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;transition:.16s;}
  .modal-close:hover{border-color:var(--celadon-soft);color:var(--celadon-deep);}
  .modal-box h2{margin:0 0 6px;font-size:23px;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:14px;font-family:var(--font-kai);}
  .modal-box h2 .ava-lg{width:54px;height:54px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
  .modal-box h2 .m-t{line-height:1.1;}
  .modal-box .m-meta{font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .modal-box .m-body{font-size:14px;line-height:1.8;}
  .modal-box .m-body h4{font-size:15px;margin:22px 0 10px;color:var(--ink);font-family:var(--font-kai);letter-spacing:.04em;
    padding-left:11px;border-left:3px solid var(--celadon);}
  .modal-box .m-body .skill{border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin:12px 0;background:var(--card);}
  .modal-box .m-body .skill .name{font-weight:700;color:var(--celadon-deep);font-size:15.5px;}
  .modal-box .m-body .skill .tag{font-size:12px;color:#fff;background:var(--celadon);border-radius:6px;padding:1px 8px;margin-left:8px;}
  .modal-box .m-body .skill .desc{margin-top:7px;color:var(--ink-soft);}
  .modal-box .m-body .skill .note{margin-top:8px;font-size:12.5px;color:var(--celadon-deep);background:#EDF3EF;border-left:3px solid var(--celadon-soft);padding:6px 11px;border-radius:0 7px 7px 0;}
  .modal-box .m-body code{background:#F0F1EC;padding:1px 7px;border-radius:6px;font-size:13px;color:#A8432F;font-variant-numeric:tabular-nums;}
  .modal-box .m-body .combo{display:flex;flex-wrap:wrap;gap:11px;margin:12px 0;}
  .modal-box .m-body .combo .c{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;flex:1;min-width:200px;}
  .modal-box .m-body .combo .c b{color:var(--celadon-deep);}
  .modal-box .m-body ul.tips{margin:9px 0;padding-left:21px;}
  .modal-box .m-body ul.tips li{margin:6px 0;}
  .modal-box .m-body .tip-box{background:#F8F3E7;border:1px solid var(--gold);border-radius:11px;padding:13px 17px;margin:14px 0;font-size:13.5px;}
  .modal-box .m-body table{width:100%;border-collapse:collapse;margin:11px 0;font-size:12.5px;background:var(--card);}
  .modal-box .m-body th,.modal-box .m-body td{border:1px solid var(--line);padding:7px 9px;text-align:center;vertical-align:top;}
  .modal-box .m-body th{background:var(--paper-2);font-weight:600;}
  .modal-box .m-body .counter{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:13px 0;}
  .modal-box .m-body .counter .good{background:#EDF3EF;border:1px solid var(--celadon-soft);border-radius:11px;padding:13px 15px;}
  .modal-box .m-body .counter .bad{background:#F8EFEB;border:1px solid #E0B3A6;border-radius:11px;padding:13px 15px;}

  /* 卡片版本增削徽标 */
  .vt{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .vt-buff{background:rgba(60,90,78,.14);color:#3C5A4E;}
  .vt-nerf{background:rgba(190,90,69,.14);color:#A33C2C;}
  .vt-mix{background:rgba(182,144,78,.18);color:#866023;}
  .compact .card .vt{display:none;}

  /* 分路锚点导航（应用栏内，随 sticky 应用栏常驻） */
  .subnav{display:flex;gap:6px;padding:0 4px 11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .subnav::-webkit-scrollbar{display:none;}
  .subnav a{font-size:12.5px;color:var(--ink-soft);text-decoration:none;padding:4px 13px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;transition:.18s;flex:none;}
  .subnav a:hover{color:var(--celadon-deep);border-color:var(--celadon-soft);}
  .subnav a.active{background:var(--celadon-deep);color:#fff;border-color:var(--celadon-deep);}
  .role-head{scroll-margin-top:150px;}

  /* 弹窗克制关系（可点击跳转） */
  .matchup{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;}
  .matchup h4{font-size:14px;margin:0 0 10px;color:var(--ink);font-family:var(--font-kai);letter-spacing:.04em;}
  .match-row{display:flex;align-items:flex-start;gap:10px;margin:7px 0;}
  .match-row .ml{flex:none;width:42px;font-size:12.5px;color:var(--celadon-deep);font-weight:600;padding-top:3px;}
  .match-row .ml.bad{color:#A33C2C;}
  .match-row .mnames{display:flex;flex-wrap:wrap;gap:6px;}
  .cchip{font-family:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--celadon-soft);background:rgba(110,139,123,.10);color:var(--celadon-deep);border-radius:999px;padding:2px 11px;transition:.16s;}
  .cchip:hover{border-color:var(--celadon);background:rgba(110,139,123,.18);}
  .cchip:focus-visible{outline:none;border-color:var(--celadon);box-shadow:0 0 0 3px rgba(110,139,123,.18);}
  .cchip--na{cursor:default;opacity:.6;border-style:dashed;}

  /* 更新记录 / 数据说明（原生 details，无需 JS 折叠） */
  .changelog{margin-top:18px;border:1px solid var(--line);border-radius:13px;padding:4px 16px;background:var(--card);}
  .changelog summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);padding:11px 2px;list-style:none;}
  .changelog summary::-webkit-details-marker{display:none;}
  .changelog summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--celadon-deep);transition:transform .2s;}
  .changelog[open] summary::before{transform:rotate(90deg);}
  .changelog .cl-note{font-size:13px;color:var(--ink-soft);margin:4px 2px 12px;}
  .changelog .cl-src{font-size:12.5px;color:var(--ink-soft);margin:4px 2px;}
  .changelog .cl-src b{color:var(--ink);}
  .changelog .cl-log{margin:8px 2px 14px;padding-left:20px;font-size:12.5px;color:var(--ink-soft);line-height:1.85;}
  .changelog .cl-log li{margin:3px 0;}
  /* What's New：版本新增特性（醒目卡片） */
  .cl-new{margin:6px 2px 14px;padding:12px 15px;border-radius:11px;background:rgba(110,139,123,.10);
    border:1px solid var(--celadon-soft);border-left:3px solid var(--celadon-deep);}
  .cl-new .t{display:block;font-size:13px;font-weight:700;color:var(--celadon-deep);margin-bottom:6px;letter-spacing:.02em;}
  .cl-new ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-soft);line-height:1.8;}
  .cl-new li{margin:2px 0;}

  /* ============ 暗色「月色」模式 ============ */
  [data-theme="dark"]{
    --paper:#141A17;
    --paper-2:#1E2622;
    --card:#1F2723;
    --ink:#E9EEE9;
    --ink-soft:#9FB0A6;
    --line:#2E3833;
    --celadon:#84A594;
    --celadon-deep:#AECBBB;
    --celadon-soft:#3C5247;
    --cinnabar:#D9745E;
    --gold:#CBA867;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lift:0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
  }
  [data-theme="dark"] body::before{background:
    radial-gradient(120% 70% at 82% -8%, rgba(132,165,148,.13), transparent 55%),
    radial-gradient(80% 50% at 10% 0%, rgba(203,168,103,.06), transparent 50%);}
  [data-theme="dark"] .appbar{background:rgba(20,26,23,.82);}
  [data-theme="dark"] .hero-card{background:
    radial-gradient(140% 100% at 84% -20%, rgba(132,165,148,.16), transparent 52%),
    radial-gradient(60% 60% at 14% 4%, rgba(203,168,103,.08), transparent 50%),
    linear-gradient(180deg,#1B231F 0%,#161C19 62%);
    border-color:var(--line);}
  [data-theme="dark"] .hero-card::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  [data-theme="dark"] .hero .kicker{color:var(--celadon);}
  [data-theme="dark"] .hero .chip{color:var(--celadon);background:rgba(132,165,148,.14);border-color:rgba(174,203,187,.25);}
  [data-theme="dark"] .hero-art{opacity:.32;}
  [data-theme="dark"] .seg{background:var(--paper-2);}
  [data-theme="dark"] .seg .tab.active{background:var(--card);}
  [data-theme="dark"] .tier-btn{background:var(--card);}
  [data-theme="dark"] .tier-btn.active{background:var(--celadon-deep);color:#10160F;border-color:var(--celadon-deep);}
  [data-theme="dark"] .search{background:var(--card);}
  [data-theme="dark"] .search::placeholder{color:#7E8A82;}
  [data-theme="dark"] .tag{background:rgba(132,165,148,.15);color:var(--celadon);}
  [data-theme="dark"] .ava{background:var(--paper-2);}
  [data-theme="dark"] .ava-fallback{color:var(--celadon);}
  [data-theme="dark"] .modal{background:rgba(0,0,0,.60);}
  [data-theme="dark"] .modal-box{background:var(--paper);}
  [data-theme="dark"] .modal-box .m-body .skill{background:var(--card);}
  [data-theme="dark"] .modal-box .m-body .skill .note{background:rgba(132,165,148,.12);}
  [data-theme="dark"] .modal-box .m-body code{background:rgba(217,116,94,.16);color:var(--cinnabar);}
  [data-theme="dark"] .modal-box .m-body .combo .c{background:var(--paper-2);}
  [data-theme="dark"] .modal-box .m-body th{background:var(--paper-2);}
  [data-theme="dark"] .modal-box .m-body .counter .good{background:rgba(132,165,148,.12);border-color:var(--celadon-soft);}
  [data-theme="dark"] .modal-box .m-body .counter .bad{background:rgba(217,116,94,.12);border-color:rgba(217,116,94,.40);}
  [data-theme="dark"] .modal-box .m-body .tip-box{background:rgba(203,168,103,.10);border-color:var(--gold);}
  [data-theme="dark"] .modal-close{background:var(--card);}
  [data-theme="dark"] .vt-buff{background:rgba(132,165,148,.18);color:#AECBBB;}
  [data-theme="dark"] .vt-nerf{background:rgba(217,116,94,.20);color:#E89B8C;}
  [data-theme="dark"] .vt-mix{background:rgba(203,168,103,.20);color:#DBBC7E;}
  [data-theme="dark"] .subnav a{color:var(--ink-soft);border-color:var(--line);}
  [data-theme="dark"] .subnav a:hover{color:var(--celadon);border-color:var(--celadon-soft);}
  [data-theme="dark"] .subnav a.active{background:var(--celadon-deep);color:#10160F;border-color:var(--celadon-deep);}
  [data-theme="dark"] .matchup{border-color:var(--line);}
  [data-theme="dark"] .cchip{background:rgba(132,165,148,.14);color:var(--celadon);border-color:var(--celadon-soft);}
  [data-theme="dark"] .cchip:hover{background:rgba(132,165,148,.24);}
  [data-theme="dark"] .match-row .ml.bad{color:var(--cinnabar);}
  [data-theme="dark"] .changelog{background:var(--card);}
  [data-theme="dark"] .changelog summary{color:var(--ink);}
  [data-theme="dark"] .cl-new{background:rgba(132,165,148,.12);border-color:var(--celadon-soft);}
  [data-theme="dark"] .cl-new .t{color:var(--celadon);}
  /* 暗色梯度徽标：半透明淡染 + 月白文字 */
  [data-theme="dark"] .t-T0{background:rgba(217,116,94,.20);color:#E89B8C;}
  [data-theme="dark"] .t-T05{background:rgba(203,168,103,.20);color:#DBBC7E;}
  [data-theme="dark"] .t-T1{background:rgba(132,165,148,.20);color:#AECBBB;}
  [data-theme="dark"] .t-T15{background:rgba(132,165,148,.15);color:#AECBBB;}
  [data-theme="dark"] .t-T2{background:rgba(255,255,255,.08);color:#B8C0BA;}
  [data-theme="dark"] .t-dash{background:rgba(255,255,255,.06);color:#9DA6A0;}

  @media(max-width:640px){
    /* ===== 移动端可读性优先：加大字号/间距/对比度 ===== */
    :root{--ink-soft-mobile:#3D4B43;}
    [data-theme="dark"]{--ink-soft-mobile:#B8C9BE;}
    .wrap{padding:0 14px calc(64px + env(safe-area-inset-bottom));}
    body{font-size:17px;line-height:1.75;}
    .topbar .inner{padding:11px 14px;gap:9px;}
    .brand{font-size:13.5px;gap:8px;}
    .hero{padding:26px 0 18px;}
    .hero h1{font-size:32px;}
    .hero-card{padding:26px 20px 28px;border-radius:16px;}
    .hero-art{width:100px;right:8px;bottom:6px;opacity:.18;}
    .hero .sub{font-size:14px;}
    .toolbar{padding:8px 2px 10px;}
    .toolbar .row{gap:9px;}
    /* 触控目标加大（iOS HIG 建议 ≥ 40px） */
    .seg .tab,.tier-btn,.toggle-pill{min-height:37px;padding:7px 14px;font-size:13.5px;}
    .toggle-pill{padding:7px 14px;}
    /* 移动端：分路 / 梯度胶囊改为横向滚动，避免堆叠过高 */
    .seg,.tiers{max-width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .seg::-webkit-scrollbar,.tiers::-webkit-scrollbar{display:none;}
    .count{margin-left:0;width:100%;order:6;}
    /* 搜索框独占一行 + 字号 16px（避免 iOS 输入聚焦时自动放大） */
    .search-wrap{flex-basis:100%;width:100%;min-width:0;order:5;}
    .search{font-size:16px;padding:10px 14px 10px 38px;}
    /* 卡片双列，提升扫读效率 —— 加大字号与间距确保可读 */
    .grid,.grid.compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .card{padding:16px 15px;border-radius:13px;}
    .card .nm{font-size:16px;font-weight:700;letter-spacing:.03em;color:var(--ink);}
    .card .core{font-size:14.5px;line-height:1.8;-webkit-line-clamp:3;color:var(--ink-soft-mobile, var(--ink-soft));}
    .ava{width:40px;height:40px;border-radius:11px;}
    .compact .card .ava{width:36px;height:36px;}
    .tags{margin-top:10px;gap:6px;}
    .tag{font-size:12px;padding:3px 10px;font-weight:500;}
    .tier{font-size:12px;padding:3px 10px;font-weight:700;letter-spacing:.04em;}
    .vt{font-size:11.5px;padding:2px 7px;font-weight:700;}
    /* 弹窗安全区适配 + 移动端字号放大 */
    .modal{padding:calc(18px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));}
    .modal-box{padding:22px 18px;border-radius:16px;max-height:90vh;}
    .modal-box h2{font-size:20px;gap:11px;}
    .modal-box h2 .ava-lg{width:46px;height:46px;}
    .modal-close{width:36px;height:36px;font-size:22px;top:14px;right:14px;}
    .modal-box .m-body{font-size:15px;line-height:1.85;}
    .modal-box .m-body .counter{grid-template-columns:1fr;}
    .cchip{min-height:34px;padding:4px 13px;font-size:13px;}
    .foot{font-size:11.5px;}
  }
  @media(max-width:380px){
    .hero h1{font-size:28px;}
    .card .nm{font-size:15px;}
    .ava{width:36px;height:36px;}
    .card .core{font-size:14px;-webkit-line-clamp:2;}
  }
  @media(prefers-reduced-motion:reduce){
    .card{animation:none;opacity:1;transform:none;}
    .modal-box{animation:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>
<div class="wrap">

<div class="appbar">
  <header class="topbar">
    <div class="inner">
      <span class="brand">
        <span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 8 C13.5 12.5 13.5 17 16 22 C18.5 17 18.5 12.5 16 8 Z M16 22 C11 19 8 16.5 9 12.5 C13 14.5 14.8 17.5 16 22 Z M16 22 C21 19 24 16.5 23 12.5 C19 14.5 17.2 17.5 16 22 Z" fill="#F7F8F4"/></svg></span>
        王者荣耀 · S44 攻略总集
      </span>
      <span class="meta" id="topMeta"></span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换深色模式">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>
  <div class="toolbar">
    <div class="row">
      <div class="seg" id="roleTabs" role="tablist" aria-label="分路筛选">
        <button class="tab active" data-role="all">全部</button>
        <button class="tab" data-role="top">对抗路</button>
        <button class="tab" data-role="jungle">打野</button>
        <button class="tab" data-role="mid">中路</button>
        <button class="tab" data-role="adc">发育路</button>
        <button class="tab" data-role="support">游走</button>
      </div>
      <div class="seg" id="sortTabs" role="tablist" aria-label="排序">
        <button class="tab active" data-sort="default">默认</button>
        <button class="tab" data-sort="tier">梯度</button>
        <button class="tab" data-sort="name">名字</button>
      </div>
      <div class="tiers" id="tierGroup" aria-label="梯度筛选">
        <button class="tier-btn active" data-tier="all">全部梯度</button>
        <button class="tier-btn" data-tier="T0">T0</button>
        <button class="tier-btn" data-tier="T0.5">T0.5</button>
        <button class="tier-btn" data-tier="T1">T1</button>
        <button class="tier-btn" data-tier="T1.5">T1.5</button>
        <button class="tier-btn" data-tier="T2">T2</button>
      </div>
      <button class="toggle-pill" id="compactToggle" type="button" aria-pressed="false" title="切换紧凑视图（更多列 / 收起简介）"><span class="dot"></span>紧凑</button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5" stroke-linecap="round"/></svg>
        <input class="search" id="search" placeholder="搜索英雄名 / 标签（如 暴击、真伤、致盲）" aria-label="搜索">
      </div>
      <span class="count" id="count"></span>
    </div>
  </div>
  <nav class="subnav" id="anchorNav" aria-label="分路快速跳转">
    <a href="#role-top" data-role="top">对抗路</a>
    <a href="#role-jungle" data-role="jungle">打野</a>
    <a href="#role-mid" data-role="mid">中路</a>
    <a href="#role-adc" data-role="adc">发育路</a>
    <a href="#role-support" data-role="support">游走</a>
  </nav>
</div>

<header class="hero">
  <div class="hero-card">
    <svg class="hero-art" viewBox="0 0 240 132" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <!-- 远山：三层山脊，越远越淡，营造水墨纵深 -->
        <path d="M0 80 C26 72 46 78 74 70 C100 62 126 80 154 73 C184 66 212 76 240 69" stroke-width="1.1" opacity=".55"/>
        <path d="M0 96 C24 88 48 95 76 86 C104 77 130 96 158 89 C186 82 214 93 240 86" stroke-width="1.4" opacity=".8"/>
        <path d="M0 114 C34 107 62 112 94 105 C122 99 152 113 182 107 C206 102 226 110 240 107" stroke-width="1.8"/>
        <!-- 一叶扁舟：弧线船身 + 细竿 -->
        <path d="M150 118 q13 8 28 0" stroke-width="1.6"/>
        <path d="M164 118 L164 104" stroke-width="1.1" opacity=".7"/>

      <!-- 淡月 -->
      <circle cx="190" cy="34" r="13" fill="currentColor" opacity=".16"/>
    </svg>
    <p class="kicker">王者荣耀 · S44 赛季 · 数据驱动</p>
    <h1>全英雄攻略<span class="accent">总集</span></h1>
    <p class="sub">按分路归类，轻点卡片查看详细攻略 —— 含本赛季版本调整、梯度、出装铭文与克制关系。</p>
    <div class="chips" id="metaBadges"></div>
  </div>
</header>

<main id="list"></main>

<footer class="foot">
  本攻略总集基于王者荣耀 S44 赛季公开资料（百度百科、官方公告、主流攻略榜）整理，数值与梯度以正式服为准。<br>
  数据文件：<b>heroes-data.js</b>（单一数据源，自动 / 按需更新）· 渲染器：index.html <span id="footVer"></span><br>
  加英雄 / 刷新版本：告诉 WorkBuddy 即可（已配置「wzry-guide」技能 + 每周自动校准）。
  <div id="metaPanel"></div>
</footer>

</div>

<!-- 弹窗 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    <h2 id="mTitle"></h2>
    <div class="m-meta" id="mMeta"></div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>

<script src="heroes-data.js"></script>
<script>
(function(){
  var META = window.GUIDE_META || {};
  var HEROES = window.HEROES || [];
  var ROLE_LABEL = {top:'对抗路', jungle:'打野', mid:'中路', adc:'发育路', support:'游走'};
  var ROLE_ORDER = ['top','jungle','mid','adc','support'];
  var byName = {}; HEROES.forEach(function(h){ byName[h.name] = h; });
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // 解析 detailed 中的版本块，给出 增强(buff)/削弱(nerf)/混合(mix)/无(null) 标记
  function versionTag(d){
    if(!d) return null;
    var buff = /(增强|加强|提升|上调|回调)/.test(d);
    var nerf = /(削弱|降温|下调|砍|削|抑制)/.test(d);
    if(buff && nerf) return 'mix';
    if(buff) return 'buff';
    if(nerf) return 'nerf';
    return null;
  }
  var TIER_CLASS = function(t){
    if(t==='T0') return 't-T0';
    if(t==='T0.5') return 't-T05';
    if(t==='T1') return 't-T1';
    if(t==='T1.5') return 't-T15';
    if(t==='T2') return 't-T2';
    return 't-dash';
  };
  var state = {role:'all', tier:'all', q:'', compact:false, sort:'default'};
  try{ if(localStorage.getItem('wzry-compact')==='1'){ state.compact = true; } }catch(e){}

  // 头部信息（无重复：总数只在顶栏、版本只在顶栏/页脚；无版本号时不留空尾）
  var metaStr = '全 ' + HEROES.length + ' 名';
  if(META.version) metaStr += ' · v' + META.version;
  document.getElementById('topMeta').textContent = metaStr;
  document.getElementById('footVer').textContent = META.version ? ('· v' + META.version) : '';
  var badges = document.getElementById('metaBadges');
  var btexts = [];
  if(META.season) btexts.push('赛季：'+META.season);
  if(META.seasonStart) btexts.push('开启：'+META.seasonStart);
  if(META.patch) btexts.push(META.patch);
  badges.innerHTML = btexts.map(function(b){return '<span class="chip">'+b+'</span>';}).join('');
  // 更新记录 / 数据说明（原生 details 折叠，无需额外 JS）
  var mp = document.getElementById('metaPanel');
  if(mp && META && (META.updateLog || META.source || META.note || META.whatsNew)){
    var mh = '<details class="changelog" open><summary>更新记录 · 数据说明'+(META.version?('（v'+esc(META.version)+'）'):'')+'</summary>';
    if(META.whatsNew && META.whatsNew.length){
      mh += '<div class="cl-new"><span class="t">新版本 v'+esc(META.version||'')+' 新增特性</span><ul>'
          + META.whatsNew.map(function(n){return '<li>'+esc(n)+'</li>';}).join('') + '</ul></div>';
    }
    if(META.note) mh += '<p class="cl-note">'+esc(META.note)+'</p>';
    if(META.source) mh += '<p class="cl-src"><b>数据来源：</b>'+esc(META.source)+'</p>';
    if(META.season) mh += '<p class="cl-src"><b>赛季：</b>'+esc(META.season)+(META.seasonStart?('（'+esc(META.seasonStart)+' 开启）'):'')+'</p>';
    if(META.updateLog && META.updateLog.length){ mh += '<ul class="cl-log">'; META.updateLog.forEach(function(l){ mh += '<li>'+esc(l)+'</li>'; }); mh += '</ul>'; }
    mh += '</details>';
    mp.innerHTML = mh;
  }

  function tierRank(t){ return t==='T0'?0 : t==='T0.5'?1 : t==='T1'?2 : t==='T1.5'?3 : t==='T2'?4 : 9; }
  function gridClass(){ return 'grid' + (state.compact ? ' compact' : ''); }

  function filtered(){
    return HEROES.filter(function(h){
      if(state.role!=='all' && h.role!==state.role) return false;
      if(state.tier!=='all' && h.tier!==state.tier) return false;
      if(state.q){
        var q = state.q.toLowerCase();
        var hay = (h.name+' '+(h.tags||[]).join(' ')+(h.core||'')).toLowerCase();
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
  }

  // 卡片：仅 名称 + 梯度 + 核心一句话 + 标签（角色由分组标题承担，避免重复）
  function avatarHTML(h){
    var ch = (h.name||'?').charAt(0);
    if(h.avatar){
      return '<img class="ava" alt="'+h.name+'" loading="lazy" src="'+h.avatar+'" onerror="avaFail(this,\''+ch+'\')">';
    }
    return '<span class="ava ava-fallback">'+ch+'</span>';
  }
  window.avaFail = function(img, ch){
    var s = document.createElement('span');
    s.className = 'ava ava-fallback';
    s.textContent = ch;
    if(img.parentNode) img.parentNode.replaceChild(s, img);
  };
  function cardHTML(h, i){
    var tags = (h.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
    var cls = 'card' + (h.detailed ? ' has-detail':'');
    var tierLabel = h.tier==='—' ? '待定' : h.tier;
    var vt = versionTag(h.detailed);
    var vtHTML = vt ? '<span class="vt vt-'+vt+'" title="本赛季'+(vt==='buff'?'增强':vt==='nerf'?'削弱':'调整')+'">'+(vt==='buff'?'↑增':vt==='nerf'?'↓削':'⇅调')+'</span>' : '';
    return '<article class="'+cls+'" data-id="'+h.id+'" tabindex="0" role="button" aria-label="'+h.name+' 攻略" style="--i:'+i+'">'
      + '<div class="card-top"><div class="lead">'+avatarHTML(h)+'<h3 class="nm">'+h.name+'</h3></div>'+vtHTML+'<span class="tier '+TIER_CLASS(h.tier)+'">'+tierLabel+'</span></div>'
      + '<p class="core">'+(h.core||'')+'</p>'
      + (tags?'<div class="tags">'+tags+'</div>':'')
      + '</article>';
  }

  var spyObs = null;
  function updateAnchorNav(){
    var nav = document.getElementById('anchorNav');
    if(nav) nav.style.display = (state.sort==='default' && state.role==='all') ? '' : 'none';
  }
  function setupScrollspy(){
    if(!('IntersectionObserver' in window)) return;
    if(spyObs){ try{ spyObs.disconnect(); }catch(e){} }
    var heads = document.querySelectorAll('.role-head');
    if(!heads.length) return;
    spyObs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          var r = e.target.id.replace('role-','');
          Array.prototype.forEach.call(document.querySelectorAll('#anchorNav a'), function(a){
            a.classList.toggle('active', a.getAttribute('data-role')===r);
          });
        }
      });
    }, {rootMargin:'-35% 0px -55% 0px', threshold:0});
    heads.forEach(function(h){ spyObs.observe(h); });
  }

  function render(){
    var list = document.getElementById('list');
    var data = filtered();
    document.getElementById('count').textContent = '共 '+data.length+' 名';
    if(!data.length){
      list.innerHTML = '<div class="empty">没有匹配的英雄，换个筛选条件试试。'
        + '<br><button id="resetFilters" type="button">清除筛选</button></div>';
      var rb = document.getElementById('resetFilters');
      if(rb) rb.addEventListener('click', function(){
        state.role='all'; state.tier='all'; state.q=''; state.sort='default';
        document.getElementById('search').value='';
        Array.prototype.forEach.call(document.querySelectorAll('#roleTabs .tab'), function(t){t.classList.toggle('active', t.getAttribute('data-role')==='all');});
        Array.prototype.forEach.call(document.querySelectorAll('#tierGroup .tier-btn'), function(t){t.classList.toggle('active', t.getAttribute('data-tier')==='all');});
        Array.prototype.forEach.call(document.querySelectorAll('#sortTabs .tab'), function(t){t.classList.toggle('active', t.getAttribute('data-sort')==='default');});
        render();
      });
      updateAnchorNav();
      return;
    }

    var html = '', gi = 0;
    if(state.sort==='default' && state.role==='all'){
      ROLE_ORDER.forEach(function(r){
        var group = data.filter(function(h){return h.role===r;});
        if(!group.length) return;
        group.sort(function(a,b){ return tierRank(a.tier)-tierRank(b.tier); });
        html += '<section class="role-head" id="role-'+r+'"><span class="name">'+ROLE_LABEL[r]+'</span>'
              + '<span class="desc">'+roleDesc(r)+'</span><span class="rcount">'+group.length+' 名</span></section>';
        html += '<div class="'+gridClass()+'">'+ group.map(function(h){return cardHTML(h, gi++);}).join('') +'</div>';
      });
      list.innerHTML = html;
      setupScrollspy();
    } else if(state.role!=='all' && state.sort==='default'){
      list.innerHTML = '<div class="'+gridClass()+'">'+ data.map(function(h){return cardHTML(h, gi++);}).join('') +'</div>';
    } else {
      var arr = data.slice();
      if(state.sort==='tier') arr.sort(function(a,b){ return tierRank(a.tier)-tierRank(b.tier) || a.name.localeCompare(b.name,'zh'); });
      else arr.sort(function(a,b){ return a.name.localeCompare(b.name,'zh'); });
      list.innerHTML = '<div class="'+gridClass()+'">'+ arr.map(function(h){return cardHTML(h, gi++);}).join('') +'</div>';
    }
    updateAnchorNav();
    bindCards();
  }

  function roleDesc(r){
    return ({
      top:'战士 / 坦克，版本偏向暴击流 + 无象神器红利',
      jungle:'刺客 / 战士，低分容错优先，高分绝活看上限',
      mid:'法师，清线游走 + 团战消耗核心',
      adc:'射手，暴击流崛起，后期核心输出',
      support:'辅助，软硬双霸，开团与保人兼具'
    })[r] || '';
  }

  function bindCards(){
    var list = document.getElementById('list');
    Array.prototype.forEach.call(list.querySelectorAll('.card'), function(el){
      var open = function(){ var h = HEROES.find(function(x){return x.id===el.getAttribute('data-id');}); openModal(h); };
      el.addEventListener('click', open);
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
    });
  }

  // 克制关系：可点击跳转（仅在英雄存在于数据集中时可点）
  function cchip(name){
    if(byName[name]) return '<button type="button" class="cchip" data-name="'+esc(name)+'">'+esc(name)+'</button>';
    return '<span class="cchip cchip--na" title="不在当前 137 名正式服名单">'+esc(name)+'</span>';
  }
  function matchupHTML(h){
    var g = (h.good||[]).map(cchip).join('');
    var b = (h.bad||[]).map(cchip).join('');
    if(!g && !b) return '';
    return '<div class="matchup"><h4>克制关系</h4>'
      + (g ? '<div class="match-row"><span class="ml">好打</span><span class="mnames">'+g+'</span></div>' : '')
      + (b ? '<div class="match-row"><span class="ml bad">怕</span><span class="mnames">'+b+'</span></div>' : '')
      + '</div>';
  }
  function bindMatchChips(root){
    Array.prototype.forEach.call(root.querySelectorAll('.cchip[data-name]'), function(el){
      el.addEventListener('click', function(){
        var hh = byName[el.getAttribute('data-name')];
        if(hh) openModal(hh);
      });
    });
  }

  function openModal(h){
    var ch = (h.name||'?').charAt(0);
    var av = h.avatar ? '<img class="ava ava-lg" alt="" loading="lazy" src="'+h.avatar+'" onerror="avaFail(this,\''+ch+'\')">' : '<span class="ava ava-lg ava-fallback">'+ch+'</span>';
    document.getElementById('mTitle').innerHTML = av + '<span class="m-t">'+h.name+'</span>';
    var meta = ROLE_LABEL[h.role] + ' · 梯度 ' + (h.tier==='—'?'待定':h.tier);
    if(h.tags && h.tags.length) meta += ' · ' + h.tags.join('/');
    document.getElementById('mMeta').textContent = meta;
    var body = '';
    if(h.detailed){
      body = h.detailed;
    } else {
      body += '<p><b>核心定位：</b>'+(h.core||'')+'</p>';
      if(h.tags) body += '<p><b>标签：</b>'+h.tags.join('、')+'</p>';
      if(h.build) body += '<p><b>出装方向：</b>'+h.build+'</p>';
      body += '<div class="tip-box">该英雄目前为摘要卡，详细攻略待补全。告诉 WorkBuddy「补全 '+h.name+' 详细攻略」即可生成完整版并内嵌到此弹窗。</div>';
    }
    body += matchupHTML(h);   // 克制关系始终展示（即便有 detailed，good/bad 也一并呈现）
    document.getElementById('mBody').innerHTML = body;
    bindMatchChips(document.getElementById('mBody'));
    var box = document.querySelector('.modal-box'); if(box) box.scrollTop = 0;
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeModal(){
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow='';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // 工具栏事件
  document.getElementById('roleTabs').addEventListener('click', function(e){
    if(!e.target.classList.contains('tab')) return;
    Array.prototype.forEach.call(this.querySelectorAll('.tab'), function(t){t.classList.remove('active');});
    e.target.classList.add('active');
    state.role = e.target.getAttribute('data-role');
    render();
  });
  document.getElementById('tierGroup').addEventListener('click', function(e){
    if(!e.target.classList.contains('tier-btn')) return;
    Array.prototype.forEach.call(this.querySelectorAll('.tier-btn'), function(t){t.classList.remove('active');});
    e.target.classList.add('active');
    state.tier = e.target.getAttribute('data-tier');
    render();
  });
  document.getElementById('search').addEventListener('input', function(e){
    state.q = e.target.value.trim();
    render();
  });
  document.getElementById('sortTabs').addEventListener('click', function(e){
    if(!e.target.classList.contains('tab')) return;
    Array.prototype.forEach.call(this.querySelectorAll('.tab'), function(t){t.classList.remove('active');});
    e.target.classList.add('active');
    state.sort = e.target.getAttribute('data-sort');
    render();
  });

  // 主题切换（月色 / 晴昼），持久化到 localStorage
  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('wzry-theme', next); }catch(e){}
  });

  // 紧凑视图开关，持久化到 localStorage
  var compactBtn = document.getElementById('compactToggle');
  if(state.compact){ compactBtn.classList.add('active'); compactBtn.setAttribute('aria-pressed','true'); }
  compactBtn.addEventListener('click', function(){
    state.compact = !state.compact;
    compactBtn.classList.toggle('active', state.compact);
    compactBtn.setAttribute('aria-pressed', state.compact ? 'true' : 'false');
    try{ localStorage.setItem('wzry-compact', state.compact ? '1' : '0'); }catch(e){}
    render();
  });

  render();
})();
</script>
</body>
</html>
